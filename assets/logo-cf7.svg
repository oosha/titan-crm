<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Contact Form 7">
  <!-- Contact Form 7's mark: a snow-capped peak in a circle. Drawn rather than
       embedded so it stays crisp at any tile size and carries no binary into the
       repo; swap for the official file if one is added to /assets. -->
  <defs>
    <clipPath id="cf7-disc"><circle cx="50" cy="50" r="45"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="45" fill="#4ac7ee"/>
  <g clip-path="url(#cf7-disc)">
    <!-- Far slope, the darker blue mass. -->
    <path d="M50 22 L104 100 L-4 100 Z" fill="#1c4f87"/>
    <!-- Snow cap, with the meltwater fingers running down the near face. -->
    <path d="M50 22
             L64 42 L58 46 L66 58 L60 57 L66 68
             L60 64 L57 72 L52 62 L47 74 L42 64
             L37 70 L33 60 L28 62 L36 46 L31 44 Z"
          fill="#ffffff"/>
  </g>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#231f20" stroke-width="6"/>
  <path d="M50 22 L104 100 M50 22 L-4 100" fill="none" stroke="#231f20" stroke-width="5"
        stroke-linecap="round" clip-path="url(#cf7-disc)"/>
</svg>
