<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Companies — Titan CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Persona loader: ?u=<id> scopes the /api/data fetch, and loads personas/<id>.js
     purely for the account's currency symbol (records don't all carry their own). -->
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('u');
    var u = (raw && /^[a-z0-9_-]{1,32}$/.test(raw)) ? raw.toLowerCase() : null;
    if (u) document.write('<' + 'script src="/personas/' + u + '.js"><' + '/script>');
  })();
</script>
  <!-- Design system tokens. Everything below can use --text-primary, --accent-primary,
       and the bridged --dir-* names; see design-system/DESIGN-SYSTEM.md. -->
<link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
<link rel="stylesheet" href="/titan-sidebar.css">
<link rel="stylesheet" href="/crm-directory.css">
</head>
<body data-subpage="companies" data-sidebar-data="page">

<div class="app-window">
  <!-- The sidebar is one component: titan-sidebar.js renders it and owns its
       markup, rows and active state. Do not hand-maintain nav markup here. -->
  <div id="sidebar-mount"></div>

  <div class="main-area">
    <div class="subpage-top">
      <span class="subpage-back" onclick="location.href=crmPath('/crm')">
        <span data-ds-icon="back" data-size="13"></span>
        Back
      </span>
      <span class="subpage-title">Companies</span>
    </div>

    <div class="subpage-body">
      <div class="dir-wrap">
        <div class="dir-toolbar">
          <input class="dir-search" id="k-search" type="search" placeholder="Search by company, website, location…">
          <span class="dir-count" id="k-count"></span>
        </div>
        <div class="dir-card">
          <table class="dir-table">
            <thead>
              <tr>
                <th>Company</th>
                <th>People</th>
                <th>Open amount</th>
                <th>Last activity</th>
                <th>Records</th>
              </tr>
            </thead>
            <tbody id="k-body"></tbody>
          </table>
          <div class="dir-empty" id="k-empty" style="display:none;"></div>
        </div>
        <div class="dir-note" id="k-note"></div>
      </div>
    </div>
  </div>
</div>

<script src="/design-system/components/icon.js"></script>
<script src="/crm-schema.js"></script>
<script src="/titan-sidebar.js"></script>
<script src="/crm-directory.js"></script>
<script>
  // One row per company, merged across every pipeline it appears in.
  function buildCompanies(pipelines) {
    const byKey = new Map();
    allCards(pipelines).forEach(function (entry) {
      const card = entry.card;
      // A person-subject pipeline's company field is the employer, not a customer —
      // a hiring board would otherwise list every candidate's current employer here
      // as though you sold to them.
      if (window.titanSchema.isPerson(entry.pipeline)) return;
      const name = String(card.company || '').trim();
      if (!name) return;   // records with no company don't belong on this page
      const key = name.toLowerCase();
      let row = byKey.get(key);
      if (!row) {
        row = { company: name, website: '', location: '', linkedin: '', instagram: '', records: [], contacts: new Map(), totals: {} };
        byKey.set(key, row);
      }
      if (!row.website && card.website) row.website = card.website;
      if (!row.location && card.location) row.location = card.location;
      if (!row.linkedin && card.companyLinkedin) row.linkedin = card.companyLinkedin;
      if (!row.instagram && card.instagram) row.instagram = card.instagram;
      row.records.push(entry);
      contactsOf(card).forEach(function (c) {
        const ck = String(c.email || c.name || '').trim().toLowerCase();
        if (ck && !row.contacts.has(ck)) row.contacts.set(ck, c);
      });
      // Records in a pipeline can carry different currencies, so total per symbol
      // rather than silently adding unlike amounts together.
      const cur = card.currency || defaultCurrency();
      row.totals[cur] = (row.totals[cur] || 0) + (Number(card.value) || 0);
    });
    return Array.from(byKey.values()).sort(function (a, b) { return a.company.localeCompare(b.company); });
  }

  function totalsText(totals) {
    const parts = Object.keys(totals)
      .filter(function (cur) { return totals[cur] > 0; })
      .map(function (cur) { return cur + Number(totals[cur]).toLocaleString(); });
    return parts.length ? parts.join(' · ') : '';
  }

  function renderCompanies(rows) {
    const body = document.getElementById('k-body');
    const empty = document.getElementById('k-empty');
    document.getElementById('k-count').textContent = rows.length + (rows.length === 1 ? ' company' : ' companies');
    if (!rows.length) {
      body.innerHTML = '';
      empty.style.display = '';
      empty.textContent = 'No companies yet — they appear here once records have a company set.';
      return;
    }
    empty.style.display = 'none';
    body.innerHTML = rows.map(function (r, i) {
      const people = Array.from(r.contacts.values());
      const firstEmail = (people[0] || {}).email || '';
      const domain = companyDomainFor({ company: r.company, website: r.website, contactEmail: firstEmail });
      const money = totalsText(r.totals);
      const last = lastActivityOf(r.records);
      const search = [r.company, r.website, r.location, domain].concat(
        people.map(function (p) { return (p.name || '') + ' ' + (p.email || ''); })
      ).join(' ').toLowerCase();
      return '<tr tabindex="0" role="button" aria-selected="false" data-idx="' + i + '" data-search="' + esc(search) + '">' +
        '<td><div class="dir-name-cell">' +
          companyLogoHTML({ company: r.company, website: r.website, contactEmail: firstEmail }) +
          '<div class="dir-name-text">' +
            '<div class="dir-name">' + esc(r.company) + '</div>' +
            (domain
              ? '<div class="dir-sub"><a class="dir-link" href="https://' + esc(domain) + '" target="_blank" rel="noopener">' + esc(domain) + '</a></div>'
              : '') +
          '</div>' +
        '</div></td>' +
        // One person is worth naming; a crowd is worth counting.
        '<td>' + (people.length === 1
          ? '<div class="dir-name-cell">' + avatarHTML(people[0].name || people[0].email) +
              '<div class="dir-name-text"><div class="dir-name" style="font-weight:400;">' +
              (esc(people[0].name) || esc(people[0].email)) + '</div></div></div>'
          : people.length
            // A bare number beside the faces reads as ambiguous — it could as easily be
            // a count of records or of anything else in the row. Name the unit.
            ? '<span class="dir-facepile">' +
                people.slice(0, 3).map(function (p) { return avatarHTML(p.name || p.email); }).join('') +
                '<span class="dir-facepile-count">' + people.length + ' contacts</span>' +
              '</span>'
            : '<span class="dir-muted">—</span>') + '</td>' +
        '<td class="dir-num">' + (money ? esc(money) : '<span class="dir-muted">—</span>') + '</td>' +
        '<td>' + lastActivityCellHTML(last) + '</td>' +
        '<td>' + recordChipsHTML(r.records) + '</td>' +
      '</tr>';
    }).join('');
  }

  // ── Detail panel ───────────────────────────────────────────────────────────
  function openCompany(r, row) {
    const people = Array.from(r.contacts.values());
    const firstEmail = (people[0] || {}).email || '';
    const domain = companyDomainFor({ company: r.company, website: r.website, contactEmail: firstEmail });
    const n = r.records.length;

    const peopleList = people.length
      ? people.map(function (p) {
          return '<a class="dir-person is-link" href="' + esc(contactHref(p)) + '">' +
            avatarHTML(p.name || p.email) +
            '<div class="dir-person-text">' +
              '<div class="dir-person-name">' + (esc(p.name) || esc(p.email)) + '</div>' +
              (p.designation
                // Inside this company's own panel, "… at <this company>" is the panel
                // title repeated — same trim the contact header does.
                ? '<div class="dir-person-sub">' + esc(titleWithoutOrg(p.designation, r.company)) + '</div>'
                : '') +
            '</div>' +
            '<span class="dir-person-go" data-ds-icon="forward" data-size="12"></span>' +
          '</a>';
        }).join('')
      : '<div class="stage-caption">No one is attached to these records yet.</div>';

    openPanel(
      {
        avatar: companyLogoHTML({ company: r.company, website: r.website, contactEmail: firstEmail }),
        name: esc(r.company),
        role: domain ? esc(domain) : '',
      },
      sectionHTML(people.length === 1 ? '1 person' : people.length + ' people', peopleList) +
      sectionHTML(n + ' ' + entityNoun(r.records, n), r.records.map(panelRecordHTML).join('')),
      row
    );
  }

  (async function init() {
    let data;
    try { data = await fetchPipelineData(); }
    catch (e) {
      document.getElementById('k-note').innerHTML =
        'Couldn’t reach the CRM data API. <a href="' + crmPath('/crm') + '">Open Titan CRM</a>';
      return;
    }
    const pipelines = data.pipelines || {};
    window.titanSidebar.setPipelines(Object.keys(pipelines).map(function (id) { return pipelines[id]; }));
    const rows = buildCompanies(pipelines);
    renderCompanies(rows);
    wireSearch('k-search', 'k-body', 'k-count', 'company');
    wireRows('k-body', function (idx, tr) { openCompany(rows[idx], tr); });

    // ?company=<name> — arriving from a contact's "… @ Company" link. Opens that
    // company's panel and scrolls to its row, leaving the rest of the list in
    // place so you can still see where it sits among the others.
    const wanted = new URLSearchParams(location.search).get('company');
    if (wanted) {
      const want = wanted.trim().toLowerCase();
      const i = rows.findIndex(function (r) { return r.company.trim().toLowerCase() === want; });
      const tr = i === -1 ? null : document.querySelector('#k-body tr[data-idx="' + i + '"]');
      if (tr) {
        openCompany(rows[i], tr);
        tr.scrollIntoView({ block: 'center' });
      } else {
        document.getElementById('k-note').textContent = 'No company called “' + wanted + '” — it may have been renamed.';
      }
    }
  })();
</script>
</body>
</html>
