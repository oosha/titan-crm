<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Integrations — Titan CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Hotjar. One shared file rather than the snippet pasted into every page;
     see analytics.js. Loaded early so a session is recorded from first paint. -->
<script src="/analytics.js"></script>
<!-- Persona loader: ?u=<id> scopes which persona's connections are read, and
     loads personas/<id>.js for the account identity in the sidebar. -->
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('u');
    var u = (raw && /^[a-z0-9_-]{1,32}$/.test(raw)) ? raw.toLowerCase() : null;
    if (u) document.write('<' + 'script src="/personas/' + u + '.js"><' + '/script>');
  })();
</script>
  <!-- Design system tokens. Everything below can use --text-primary, --accent-primary,
       and the bridged --dir-* names; see design-system/DESIGN-SYSTEM.md. -->
<link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
<link rel="stylesheet" href="/titan-sidebar.css">
<link rel="stylesheet" href="/titan-assistant.css">
<link rel="stylesheet" href="/crm-directory.css">
<link rel="stylesheet" href="/integrations.css">
</head>
<body data-subpage="integrations" data-sidebar-data="page">

<div class="app-window">
  <!-- The sidebar is one component: titan-sidebar.js renders it and owns its
       markup, rows and active state. Do not hand-maintain nav markup here. -->
  <div id="sidebar-mount"></div>

  <div class="main-area">
    <div class="subpage-top">
      <!-- No back link: this is a top-level destination in its own right, reached from
           the sidebar, which is also how you leave it. A back arrow here implied it was
           somewhere you'd arrived at from the board. -->
      <span class="subpage-title">Integrations</span>
    </div>

    <div class="subpage-body">
      <div class="int-wrap int-wrap--index">
        <p class="int-intro">Connect the tools you already use, so information arrives in
          Titan without anyone retyping it.</p>
        <div class="int-grid" id="int-list"></div>

        <div class="int-section-head">Coming soon</div>
        <p class="int-section-sub">These all post submissions to a URL, so they will
          arrive the same way Contact Form 7 does. Tell us which you need and it moves up.</p>
        <div class="int-grid" id="int-soon"></div>
      </div>
    </div>
  </div>
</div>

<script src="/design-system/components/icon.js"></script>
<script src="/titan-sidebar.js"></script>
<script src="/titan-assistant.js"></script>
<script src="/crm-directory.js"></script>
<script>
  // The shelf. One row per provider, each linking to its own page — the detail
  // page owns setup and settings so this stays scannable, and so someone can see
  // what Titan connects to without first being shown a configuration screen.
  //
  // Status is read from the persona's saved data only. No provider is contacted
  // from here: this page should paint instantly and never fail because a third
  // party is slow or a key has been revoked.
  const PROVIDERS = [{
    id: 'cf7',
    name: 'Contact Form 7',
    blurb: 'WordPress forms, via a free webhook add-on',
    logo: '/assets/logo-cf7.svg',
    path: '/crm/integrations/cf7',
    // No credential to check, unlike HubSpot: CF7 pushes to a URL we hand out, so
    // "connected" is simply whether a webhook exists and knows where to put things.
    checkConnected: async function () {
      try {
        const res = await fetch('/api/inbound-config?persona=' + encodeURIComponent(window.PERSONA_ID), { cache: 'no-store' });
        if (!res.ok) return false;
        const body = await res.json();
        return (body.connections || []).some(function (c) {
          return (c.provider || 'cf7') === 'cf7' && c.map && Object.keys(c.map).length;
        });
      } catch (e) { return false; }
    },
    summarise: function (data) {
      const list = ((data.integrations && data.integrations.inbound && data.integrations.inbound.connections) || [])
        .filter(function (c) { return (c.provider || 'cf7') === 'cf7'; });
      const live = list.filter(function (c) { return c.map && Object.keys(c.map).length; }).length;
      const waiting = list.length - live;
      if (!live) return waiting ? 'Waiting for a first submission' : 'Connected — no forms set up yet';
      return (live === 1 ? '1 form connected' : live + ' forms connected') +
             (waiting ? ', ' + waiting + ' waiting' : '');
    },
  }, {
    id: 'hubspot',
    name: 'HubSpot Forms',
    blurb: 'Pulls new submissions from your HubSpot forms',
    logo: '/assets/logo-hubspot.svg',
    path: '/crm/integrations/hubspot',
    // Whether a key exists is the one thing this page can't read from the data
    // document, because credentials aren't kept there. One cheap call to the
    // store; it never returns the key itself, only whether there is one.
    checkConnected: async function () {
      // A key held in this tab counts as connected too — see the note in
      // titan-sidebar.js for why that fallback exists.
      if (window.titanHubspotKey && window.titanHubspotKey.get()) return true;
      try {
        const res = await fetch('/api/hubspot-key?persona=' + encodeURIComponent(window.PERSONA_ID), { cache: 'no-store' });
        return res.ok ? !!(await res.json()).hasKey : false;
      } catch (e) { return false; }
    },
    summarise: function (data) {
      const h = (data.integrations && data.integrations.hubspot) || {};
      // Reads both shapes: v1 stored a single connection inline, v2 uses connections[].
      const n = Array.isArray(h.connections) ? h.connections.length : (h.formGuid ? 1 : 0);
      if (!n) return 'Connected — no forms set up yet';
      return n === 1 ? '1 form connected' : n + ' forms connected';
    },
  }];

  // Not built yet. Every one of these can POST a submission to a URL, so they land on
  // the same receiver as Contact Form 7 (api/_inbound.js) with a different setup guide
  // rather than new server code — see that file's header. Listed with no route, because
  // a row that opens an empty page is worse than a row that says "not yet".
  const COMING_SOON = [
    { id: 'wpforms',      name: 'WPForms',       blurb: 'WordPress forms, Elite plan',      logo: '/assets/logo-wpforms.svg' },
    { id: 'elementor',    name: 'Elementor',     blurb: 'Built into Elementor Pro forms',   logo: '/assets/logo-elementor.svg' },
    { id: 'gravityforms', name: 'Gravity Forms', blurb: 'WordPress forms, Elite licence',   logo: '/assets/logo-gravityforms.svg' },
    { id: 'wix',          name: 'Wix Forms',     blurb: 'Contact forms on a Wix site',      logo: '/assets/logo-wix.svg' },
    { id: 'mailchimp',    name: 'Mailchimp',     blurb: 'Signups and landing page forms',   logo: '/assets/logo-mailchimp.svg' },
    { id: 'googleforms',  name: 'Google Forms',  blurb: 'Responses from a Google Form',     logo: '/assets/logo-googleforms.svg' },
    { id: 'typeform',     name: 'Typeform',      blurb: 'One-question-at-a-time forms',     logo: '/assets/logo-typeform.svg' },
    { id: 'jotform',      name: 'Jotform',       blurb: 'Jotform submissions',              logo: '/assets/logo-jotform.svg' },
  ];

  function renderList(data, connectedById) {
    document.getElementById('int-list').innerHTML = PROVIDERS.map(function (p) {
      const on = !!connectedById[p.id];
      return '<div class="int-row-card">' +
        '<div class="int-card-top">' +
          '<div class="int-logo"><img src="' + esc(p.logo) + '" alt=""></div>' +
          '<div class="int-row-text">' +
            '<div class="int-row-name">' + esc(p.name) + '</div>' +
            '<div class="int-row-blurb">' + esc(on ? p.summarise(data) : p.blurb) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="int-card-foot">' +
          '<span class="int-status ' + (on ? 'on' : 'off') + '">' + (on ? 'Connected' : 'Not connected') + '</span>' +
          '<button class="dir-btn ' + (on ? '' : 'dir-btn-primary') + '" type="button" data-path="' + esc(p.path) + '">' +
            (on ? 'Manage' : 'Connect') +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('');

    document.getElementById('int-soon').innerHTML = COMING_SOON.map(function (p) {
      return '<div class="int-row-card is-soon">' +
        '<div class="int-card-top">' +
          '<div class="int-logo"><img src="' + esc(p.logo) + '" alt=""></div>' +
          '<div class="int-row-text">' +
            '<div class="int-row-name">' + esc(p.name) + '</div>' +
            '<div class="int-row-blurb">' + esc(p.blurb) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="int-card-foot"><span class="int-status soon">Coming soon</span></div>' +
      '</div>';
    }).join('');

    document.querySelectorAll('#int-list [data-path]').forEach(function (btn) {
      btn.addEventListener('click', function () { location.href = crmPath(btn.dataset.path); });
    });
  }

  (async function init() {
    let data;
    try { data = await fetchPipelineData(); }
    catch (e) {
      document.getElementById('int-list').innerHTML =
        '<div class="dir-empty">Couldn’t load your data. ' +
        '<a class="dir-link" href="' + crmPath('/crm') + '">Open Titan CRM</a></div>';
      return;
    }
    const pipelines = data.pipelines || {};
    window.titanSidebar.setPipelines(Object.keys(pipelines).map(function (id) { return pipelines[id]; }));

    // Painted as "not connected" first so the shelf appears immediately, then
    // corrected once each provider's store has answered. One provider today, but
    // asked in parallel so adding more doesn't make the page progressively slower.
    renderList(data, {});
    const states = await Promise.all(PROVIDERS.map(function (p) { return p.checkConnected(); }));
    const byId = {};
    PROVIDERS.forEach(function (p, i) { byId[p.id] = states[i]; });
    renderList(data, byId);
  })();
</script>
</body>
</html>
