<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form setup — Titan CRM</title>
<!-- Persona loader: ?u=<id> scopes the /api/data fetch and loads personas/<id>.js. -->
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('u');
    var u = (raw && /^[a-z0-9_-]{1,32}$/.test(raw)) ? raw.toLowerCase() : null;
    if (u) document.write('<' + 'script src="/personas/' + u + '.js"><' + '/script>');
  })();
</script>
  <!-- Design system tokens. Everything below can use --text-primary, --accent-primary,
       and the bridged --dir-* names; see design-system/DESIGN-SYSTEM.md. -->
<link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
<link rel="stylesheet" href="/titan-sidebar.css">
<link rel="stylesheet" href="/crm-directory.css">
<link rel="stylesheet" href="/form.css">
<link rel="stylesheet" href="/form-builder.css">
<script src="/form-render.js"></script>
<style>
  /* The deep-link route for one pipeline's form. The editor itself is
     form-builder.js, mounted inline here and opened as a modal from the Forms tab and
     the new-pipeline flow — one editor, three ways in. */
  .fp-wrap { padding: 18px 20px 60px; }
  .fp-save {
    margin-left: auto; height: 34px; padding: 0 15px; border: 1px solid var(--dir-accent);
    border-radius: 9px; background: var(--dir-accent); color: #fff;
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .fp-save:hover:not(:disabled) { background: #1b5fd0; }
  .fp-save:disabled { opacity: 0.6; cursor: default; }
  .fp-err { font-size: 12.5px; color: #c0392b; margin-right: 12px; }
</style>
</head>
<body class="subpage-body" data-subpage="form-settings" data-sidebar-data="page">

<div class="app-window">
  <!-- The sidebar is one component: titan-sidebar.js renders it. -->
  <div id="sidebar-mount"></div>

  <div class="main-area">
    <div class="subpage-top">
      <span class="subpage-back" onclick="location.href=crmPath('/crm/forms')">
        <span data-ds-icon="back" data-size="13"></span>
        Back
      </span>
      <span class="subpage-title" id="fp-title">Form setup</span>
      <span class="fp-err" id="fp-err"></span>
      <button class="fp-save" id="fp-save">Save form</button>
    </div>

    <div class="fp-wrap"><div id="fp-host"></div></div>
  </div>
</div>

<script src="/design-system/components/icon.js"></script>
<script src="/titan-sidebar.js"></script>
<script src="/crm-directory.js"></script>
<script src="/form-builder.js"></script>
<script>
  const SEGS = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
  const PIPELINE_ID = SEGS[1] === 'pipeline' && SEGS[2] ? decodeURIComponent(SEGS[2]) : '';
  let builder = null;

  (async function init() {
    try { await fetchPipelineData(); }
    catch (e) {
      document.getElementById('fp-host').innerHTML =
        '<div class="dash-empty">Couldn’t reach the CRM data API.</div>';
      return;
    }
    const pipelines = window.DATA.pipelines || {};
    window.titanSidebar.setPipelines(Object.keys(pipelines).map(function (id) { return pipelines[id]; }));

    const pipeline = pipelines[PIPELINE_ID];
    if (!pipeline) {
      document.getElementById('fp-host').innerHTML =
        '<div class="dash-empty">No such pipeline — it may have been deleted.</div>';
      document.getElementById('fp-save').style.display = 'none';
      return;
    }
    document.getElementById('fp-title').textContent = 'Form — ' + pipeline.name;

    builder = window.titanFormBuilder.mount(document.getElementById('fp-host'), {
      pipeline: pipeline,
      form: pipeline.intakeForm || null,
      personaId: window.PERSONA_ID,
    });

    document.getElementById('fp-save').addEventListener('click', async function () {
      const btn = document.getElementById('fp-save');
      const err = document.getElementById('fp-err');
      const out = builder.collect();
      if (out.error) { err.textContent = out.error; return; }
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        window.DATA.pipelines[PIPELINE_ID].intakeForm = out.form;
        window.DATA.pipelines[PIPELINE_ID].customFieldDefs = out.pipeline.customFieldDefs || [];
        await window.saveData();
        btn.textContent = 'Saved';
        setTimeout(function () { btn.disabled = false; btn.textContent = 'Save form'; }, 1200);
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Save form';
        err.textContent = 'Couldn’t save: ' + ((e && e.message) || e);
      }
    });
  })();
</script>
</body>
</html>
