<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Hotjar. One shared file rather than the snippet pasted into every page;
     see analytics.js. Loaded early so a session is recorded from first paint. -->
<script src="/analytics.js"></script>
<title>Form setup — Titan CRM</title>
<!-- Persona loader: ?u=<id> scopes the /api/data fetch and loads personas/<id>.js. -->
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('u');
    var u = (raw && /^[a-z0-9_-]{1,32}$/.test(raw)) ? raw.toLowerCase() : null;
    if (u) document.write('<' + 'script src="/personas/' + u + '.js"><' + '/script>');
  })();
</script>
  <!-- Design system tokens. Everything below can use --text-primary, --accent-primary,
       and the bridged --dir-* names; see design-system/DESIGN-SYSTEM.md. -->
<link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
<link rel="stylesheet" href="/titan-sidebar.css">
<link rel="stylesheet" href="/crm-directory.css">
<link rel="stylesheet" href="/form.css">
<link rel="stylesheet" href="/form-builder.css">
<script src="/form-render.js"></script>
<style>
  /* This full-page settings route composes the registered Two-pane workspace pattern:
     the shared task bar stays above two panes that own the remaining viewport. */
  .fp-wrap {
    width: 100%; min-height: 0; flex: 1 1 auto; overflow: hidden;
  }
  /* Pane surfaces remain full-bleed. The builder centres their inner content rails as
     one bounded 3:2 workspace, so this route keeps the host fluid. */
  #fp-host {
    width: 100%; height: 100%; min-height: 0;
  }
  body[data-subpage="form-settings"] .main-area { background: var(--surface-page); }
  /* The published result now lives in the right pane; the task bar keeps only navigation
     and the final Done action. */
  body[data-subpage="form-settings"] .subpage-top.is-published .fp-save { margin-left: auto; }
  /* Delete takes the auto margin so the two actions travel together on the right,
     rather than delete stranding itself beside the title. */
  .fp-delete { margin-left: auto; }
  .fp-save { margin-left: var(--space-100); }
  .fp-err {
    margin-right: var(--space-150); color: var(--status-danger); font-size: var(--text-xs);
  }
  /* A small first-publish celebration. Particles originate at both viewport edges and
     converge around the centred form; they never intercept input or become accessibility
     content. Colours stay on the system's semantic palette. */
  .fp-confetti { position: fixed; inset: 0; z-index: 2000; overflow: hidden; pointer-events: none; }
  .fp-confetti-piece {
    position: absolute; top: var(--start-y);
    width: var(--space-075); height: var(--space-125);
    border-radius: var(--radius-xs); background: var(--piece-color); opacity: 0;
  }
  .fp-confetti-piece.is-round { border-radius: var(--radius-full); }
  .fp-confetti-piece.from-left {
    left: 0;
    animation: fp-confetti-left var(--piece-duration) var(--ease-decel) var(--piece-delay) forwards;
  }
  .fp-confetti-piece.from-right {
    right: 0;
    animation: fp-confetti-right var(--piece-duration) var(--ease-decel) var(--piece-delay) forwards;
  }
  @keyframes fp-confetti-left {
    0% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
    12% { opacity: 1; }
    65% { opacity: 1; transform: translate(calc(32vw + var(--drift)), var(--mid-y)) rotate(var(--mid-spin)); }
    100% { opacity: 0; transform: translate(calc(50vw + var(--drift)), var(--end-y)) rotate(var(--end-spin)); }
  }
  @keyframes fp-confetti-right {
    0% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
    12% { opacity: 1; }
    65% { opacity: 1; transform: translate(calc(-32vw + var(--drift)), var(--mid-y)) rotate(var(--mid-spin)); }
    100% { opacity: 0; transform: translate(calc(-50vw + var(--drift)), var(--end-y)) rotate(var(--end-spin)); }
  }
  @media (prefers-reduced-motion: reduce) { .fp-confetti { display: none; } }
</style>
</head>
<body class="subpage-body" data-subpage="form-settings">

<div class="app-window">
  <!-- Full-page settings deliberately replaces the global CRM sidebar. -->
  <div class="main-area">
    <div class="subpage-top">
      <span class="subpage-back" id="fp-back">
        <span data-ds-icon="back" data-size="13"></span>
        <span id="fp-back-label">Back</span>
      </span>
      <span class="subpage-title" id="fp-title">Form setup</span>
      <!-- The form's link, once there is one to show. Filled by the builder's shared
           link-row renderer so the editor has one definition of this output. -->
      <div id="fp-link"></div>
      <span class="fp-err" id="fp-err"></span>
      <button class="ds-btn ds-btn--destructive-quiet fp-delete" id="fp-delete">Delete form</button>
      <button class="ds-btn ds-btn--primary fp-save" id="fp-save">Publish form</button>
    </div>

    <div class="fp-wrap"><div class="fb-inline" id="fp-host"></div></div>
  </div>
</div>

<script src="/design-system/components/icon.js"></script>
<script src="/crm-directory.js"></script>
<!-- The builder labels each field's destination in the record's own words, which
     crm-schema.js owns — without it the rows fall back to generic names. -->
<script src="/crm-schema.js"></script>
<!-- dsMenu drives the field-destination picker inside form-builder.js: one open at a
     time, outside click, Escape, arrow keys. -->
<script src="/design-system/components/menu.js"></script>
<!-- Pipeline tag names the pipeline in the builder's destination picker. -->
<script src="/design-system/components/pipeline-tag.js"></script>
<script src="/form-builder.js"></script>
<script>
  const SEGS = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
  const PIPELINE_ID = SEGS[1] === 'pipeline' && SEGS[2] ? decodeURIComponent(SEGS[2]) : '';
  let builder = null;
  let publishedView = false;
  let formExists = false;
  let editorTitle = 'Form setup';

  // A small enum preserves where the full-page task was entered without accepting an
  // arbitrary return URL. Persona and acting-user query state survive; `from` does not.
  function editorBackPath() {
    const q = new URLSearchParams(location.search);
    const from = q.get('from');
    q.delete('from');
    const query = q.toString() ? '?' + q.toString() : '';
    if (from === 'pipeline-settings') {
      return '/crm/pipeline/' + encodeURIComponent(PIPELINE_ID) + '/setting' + query + '#sources';
    }
    if (from === 'board') {
      return '/crm/pipeline/' + encodeURIComponent(PIPELINE_ID) + query;
    }
    return '/crm/forms' + query;
  }
  document.getElementById('fp-back').addEventListener('click', function () {
    if (publishedView && builder) {
      setPublishedView(false);
      return;
    }
    location.href = editorBackPath();
  });

  // The full-page pattern keeps its own task bar, while the builder owns the same body
  // transition the former modal used. Published: Back returns to editing and Done exits.
  function setPublishedView(published) {
    publishedView = published;
    builder.setPublished(published);
    document.querySelector('.subpage-top').classList.toggle('is-published', published);
    document.getElementById('fp-back-label').textContent = published ? 'Back to editing' : 'Back';
    const title = document.getElementById('fp-title');
    title.textContent = editorTitle;
    title.style.display = published ? 'none' : '';
    document.getElementById('fp-delete').style.display = (published || !formExists) ? 'none' : '';
    document.getElementById('fp-err').textContent = '';
    renderHeaderLink(published);
    const save = document.getElementById('fp-save');
    save.disabled = false;
    save.textContent = published ? 'Done' : 'Publish form';
  }

  function renderHeaderLink(published) {
    const form = window.DATA && window.DATA.pipelines &&
      window.DATA.pipelines[PIPELINE_ID] && window.DATA.pipelines[PIPELINE_ID].intakeForm;
    const host = document.getElementById('fp-link');
    if (published) { host.innerHTML = ''; return; }
    window.titanFormBuilder.linkRow(host, form && form.token);
  }

  function launchFirstPublishConfetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const layer = document.createElement('div');
    layer.className = 'fp-confetti';
    layer.setAttribute('aria-hidden', 'true');
    const colors = [
      'var(--accent-primary)', 'var(--status-success)',
      'var(--status-warning)', 'var(--text-accent)'
    ];
    for (let i = 0; i < 16; i++) {
      const piece = document.createElement('span');
      const fromLeft = i % 2 === 0;
      piece.className = 'fp-confetti-piece ' + (fromLeft ? 'from-left' : 'from-right') +
        (i % 3 === 0 ? ' is-round' : '');
      piece.style.setProperty('--start-y', (26 + Math.random() * 34) + 'vh');
      piece.style.setProperty('--drift', (-44 + Math.random() * 88) + 'px');
      piece.style.setProperty('--mid-y', (-70 + Math.random() * 105) + 'px');
      piece.style.setProperty('--end-y', (20 + Math.random() * 150) + 'px');
      piece.style.setProperty('--mid-spin', (-180 + Math.random() * 360) + 'deg');
      piece.style.setProperty('--end-spin', (-540 + Math.random() * 1080) + 'deg');
      piece.style.setProperty('--piece-delay', (Math.random() * 160) + 'ms');
      piece.style.setProperty('--piece-duration', (900 + Math.random() * 360) + 'ms');
      piece.style.setProperty('--piece-color', colors[i % colors.length]);
      layer.appendChild(piece);
    }
    document.body.appendChild(layer);
    setTimeout(function () { layer.remove(); }, 1800);
  }

  // Pipeline Settings may have preserved unrelated unsaved fields before navigating
  // here. Keep that draft, but reconcile the form fields this page actually persists so
  // returning to #sources cannot render the pre-navigation form state.
  function syncSettingsDraft(form, customFieldDefs) {
    if (new URLSearchParams(location.search).get('from') !== 'pipeline-settings') return;
    let draft = null;
    try { draft = JSON.parse(sessionStorage.getItem('titan-crm-edit-pipeline') || 'null'); }
    catch (e) { return; }
    if (!draft || draft.pipelineKey !== PIPELINE_ID || !draft.pipeline) return;
    if (form) draft.pipeline.intakeForm = form;
    else delete draft.pipeline.intakeForm;
    if (customFieldDefs) draft.pipeline.customFieldDefs = customFieldDefs;
    sessionStorage.setItem('titan-crm-edit-pipeline', JSON.stringify(draft));
  }

  (async function init() {
    try { await fetchPipelineData(); }
    catch (e) {
      document.getElementById('fp-host').innerHTML =
        '<div class="dash-empty">Couldn’t reach the CRM data API.</div>';
      return;
    }
    const pipelines = window.DATA.pipelines || {};

    const pipeline = pipelines[PIPELINE_ID];
    if (!pipeline) {
      document.getElementById('fp-host').innerHTML =
        '<div class="dash-empty">No such pipeline — it may have been deleted.</div>';
      document.getElementById('fp-save').style.display = 'none';
      document.getElementById('fp-delete').style.display = 'none';
      return;
    }

    // Nothing to delete until there is a stored form: on this route a pipeline with no
    // form yet opens the editor on a fresh one, and Back is how you abandon that.
    const delBtn = document.getElementById('fp-delete');
    formExists = !!(pipeline.intakeForm && pipeline.intakeForm.token);
    if (!formExists) delBtn.style.display = 'none';
    delBtn.addEventListener('click', async function () {
      const err = document.getElementById('fp-err');
      if (!window.titanFormBuilder.confirmDelete(pipeline.name)) return;
      err.textContent = '';
      delBtn.disabled = true; delBtn.textContent = 'Deleting…';
      // Held before the delete, not read after it: `pipeline` is the same object as
      // window.DATA.pipelines[PIPELINE_ID], so by then there is nothing to put back.
      const previous = pipeline.intakeForm;
      try {
        delete window.DATA.pipelines[PIPELINE_ID].intakeForm;
        await window.saveData();
        syncSettingsDraft(null, window.DATA.pipelines[PIPELINE_ID].customFieldDefs || []);
        // Back to the list, which is where "the form is gone" is legible. Staying here
        // would leave an editor open on a form that no longer exists.
        location.href = editorBackPath();
      } catch (e) {
        window.DATA.pipelines[PIPELINE_ID].intakeForm = previous;
        delBtn.disabled = false; delBtn.textContent = 'Delete form';
        err.textContent = 'Couldn’t delete: ' + ((e && e.message) || e);
      }
    });
    editorTitle = 'Form — ' + pipeline.name;
    document.getElementById('fp-title').textContent = editorTitle;

    builder = window.titanFormBuilder.mount(document.getElementById('fp-host'), {
      pipeline: pipeline,
      form: pipeline.intakeForm || null,
      personaId: window.PERSONA_ID,
    });

    // A form that already exists shows its link straight away. A new one has a token from
    // the moment the editor opens, but it isn't reachable until this page saves it — so the
    // row appears after the first save, not before.
    renderHeaderLink(false);

    document.getElementById('fp-save').addEventListener('click', async function () {
      const btn = document.getElementById('fp-save');
      const err = document.getElementById('fp-err');
      if (publishedView) {
        location.href = editorBackPath();
        return;
      }
      const firstPublish = !formExists;
      const out = builder.collect();
      if (out.error) { err.textContent = out.error; return; }
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Publishing…';
      try {
        window.DATA.pipelines[PIPELINE_ID].intakeForm = out.form;
        window.DATA.pipelines[PIPELINE_ID].customFieldDefs = out.pipeline.customFieldDefs || [];
        await window.saveData();
        syncSettingsDraft(out.form, window.DATA.pipelines[PIPELINE_ID].customFieldDefs);
        formExists = true;
        setPublishedView(true);
        if (firstPublish) launchFirstPublishConfetti();
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Publish form';
        err.textContent = 'Couldn’t publish: ' + ((e && e.message) || e);
      }
    });
  })();
</script>
</body>
</html>
