<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — Titan CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Hotjar. One shared file rather than the snippet pasted into every page;
     see analytics.js. Loaded early so a session is recorded from first paint. -->
<script src="/analytics.js"></script>
<!-- Persona loader: ?u=<id> scopes the /api/data fetch, and loads personas/<id>.js
     purely for the account's currency symbol (records don't all carry their own). -->
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('u');
    var u = (raw && /^[a-z0-9_-]{1,32}$/.test(raw)) ? raw.toLowerCase() : null;
    if (u) document.write('<' + 'script src="/personas/' + u + '.js"><' + '/script>');
  })();
</script>
  <!-- Design system tokens. Everything below can use --text-primary, --accent-primary,
       and the bridged --dir-* names; see design-system/DESIGN-SYSTEM.md. -->
<link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
<link rel="stylesheet" href="/titan-sidebar.css">
<link rel="stylesheet" href="/crm-directory.css">
<link rel="stylesheet" href="/titan-assistant.css">
<style>
  /* Dashboard — a read-only "cockpit" for a pipeline, laid out as a bento of
     self-contained tiles, with a mocked "Ask Titan" copilot docked on the right.
     It reuses the shell (titan-sidebar.css) and the toolbar/button/modal
     primitives + data helpers from crm-directory. Everything is derived from the
     same /api/data the board reads — no new source of truth. */

  :root {
    --dash-shadow: 0 1px 2px rgba(20,22,26,0.04), 0 3px 10px rgba(20,22,26,0.04);
    --rail-w: 344px;
  }

  /* Turn the scroll region into a two-column layout: the bento scrolls, the
     copilot rail stays put with its own internal scroll. */
  [data-subpage="dashboard"] .subpage-body { display: flex; overflow: hidden; padding: 0; }

  .dash-scroll {
    /* Slightly deeper top padding than the sides: with the page header gone, the
       tabs sit against the window edge and need the room the header used to give. */
    flex: 1; min-width: 0; overflow-y: auto; padding: 22px 22px 44px;
    /* The bento sizes to THIS element's width via container queries, so it
       reflows correctly whether the copilot rail is open or closed — not to the
       viewport, which wouldn't know about the rail. */
    container-type: inline-size; container-name: dash;
  }

  /* ── Type tabs ───────────────────────────────────────────────────────────────
     One tab per kind of pipeline in the workspace. A hiring board and a sales
     board don't share a scorecard, so they don't share a screen either — the tab
     switches the whole widget set, not a filter on one. Hidden entirely when the
     workspace only has one kind, since a lone tab is decoration. */
  .dash-tabs { display: flex; gap: 2px; margin-bottom: 14px; border-bottom: 1px solid var(--dir-line); }
  .dash-tab {
    font: inherit; font-size: 13.5px; font-weight: 600; color: var(--dir-muted);
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 0 3px 9px; margin-right: 20px; cursor: pointer; margin-bottom: -1px;
  }
  .dash-tab:hover { color: var(--dir-ink); }
  .dash-tab.is-on { color: var(--dir-accent); border-bottom-color: var(--dir-accent); }
  .dash-tab:focus-visible { outline: 2px solid var(--dir-accent); outline-offset: 2px; border-radius: 3px; }

  /* ── Toolbar ─────────────────────────────────────────────────────────────── */
  .dash-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .dash-scope {
    height: 36px; padding: 0 34px 0 12px; border: 1px solid var(--dir-line);
    border-radius: 9px; background: var(--dir-surface); font: inherit; font-size: 13px;
    font-weight: 600; color: var(--dir-body); cursor: pointer; outline: none; max-width: 240px;
  }
  .dash-scope:focus { border-color: var(--dir-accent); box-shadow: 0 0 0 3px rgba(33,112,244,0.12); }
  .dash-bar-spacer { flex: 1; }
  .dash-ghost-btn {
    display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px;
    border: 1px solid var(--dir-line); border-radius: 9px; background: var(--dir-surface);
    font: inherit; font-size: 13px; font-weight: 600; color: var(--dir-body); cursor: pointer;
  }
  .dash-ghost-btn:hover { border-color: var(--dir-accent); color: var(--dir-accent); }
  .dash-ghost-btn:focus-visible { outline: 2px solid var(--dir-accent); outline-offset: 1px; }
  .dash-ghost-btn.is-on { border-color: var(--dir-accent); color: var(--dir-accent); background: var(--dir-accent-soft); }

  /* ── Bento grid ────────────────────────────────────────────────────────────
     Four columns at full width; each tile declares a column span inline. A tile
     never carries a fixed height — same-row tiles stretch to the tallest, which
     is what gives the mosaic its flush edges. */
  .bento { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: stretch; }
  .bento > * { min-width: 0; }
  @container dash (max-width: 760px) {
    .bento { grid-template-columns: repeat(2, 1fr); }
    .bento > .tile { grid-column: span 2 !important; }
    .bento > .tile.kpi { grid-column: span 1 !important; }
  }
  @container dash (max-width: 520px) {
    .bento { grid-template-columns: 1fr; }
    .bento > * { grid-column: span 1 !important; }
  }

  .tile {
    background: var(--dir-surface); border: 1px solid var(--dir-line); border-radius: 14px;
    padding: 16px 17px; box-shadow: var(--dash-shadow); display: flex; flex-direction: column;
    position: relative;
  }
  /* Every tile sits on the same white surface. The accent shows up in the dot, the
     meter and the marks — never as a wash behind the card, which made a few tiles
     read as a different kind of thing from their neighbours. */

  .tile-head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; min-height: 26px; }
  /* Same treatment as the KPI labels up top — uppercase, tracked out, muted. The
     chart is the thing on these tiles; the title just names it. */
  .tile-title { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dir-muted); }
  .tile-meta { margin-left: auto; font-size: 11.5px; color: var(--dir-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  /* ── KPI tile ────────────────────────────────────────────────────────────────
     The number is the thing. A dot in the tile's own accent is enough to tell
     the four apart at a glance. */
  .kpi .kpi-label { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--dir-muted); }
  .kpi-dot { width: 8px; height: 8px; border-radius: 3px; background: var(--accent); flex-shrink: 0; }
  .kpi-value {
    font-size: 27px; font-weight: 760; color: var(--dir-ink); line-height: 1.1; margin-top: 9px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.015em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-sub { font-size: 12px; color: var(--dir-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ── Stage composition (one stacked bar + legend) ─────────────────────────
     A 2px gap in the surface colour does the separating between segments — no
     stroke around the marks. Only the two outer ends are data ends, so only they
     round off. */
  .stackwrap { flex: 1; display: flex; flex-direction: column; }
  .stack { display: flex; gap: 2px; height: 30px; }
  .stack-seg { min-width: 3px; border-radius: 2px; transition: flex-grow 620ms cubic-bezier(0.22,0.61,0.36,1); }
  .stack-seg:first-child { border-radius: 6px 2px 2px 6px; }
  .stack-seg:last-child { border-radius: 2px 6px 6px 2px; }
  .stack-seg:only-child { border-radius: 6px; }
  .stack + .legend { margin-top: 15px; }

  /* ── Amount-by-pipeline donut ─────────────────────────────────────────────── */
  .split { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; flex: 1; }
  .donut { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut-seg { transition: stroke-dasharray 620ms cubic-bezier(0.22,0.61,0.36,1); }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .donut-center b { font-size: 17px; font-weight: 760; color: var(--dir-ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .donut-center span { font-size: 10.5px; color: var(--dir-muted); margin-top: 2px; }
  .legend { flex: 1; min-width: 150px; }
  .legend-row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px; padding: 7px 0; }
  .legend-row + .legend-row { border-top: 1px solid var(--dir-hair); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-name { font-size: 12.5px; color: var(--dir-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend-val { font-size: 12.5px; color: var(--dir-ink); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .legend-pct { font-size: 11.5px; color: var(--dir-muted); font-variant-numeric: tabular-nums; margin-left: 4px; }

  /* ── Amount histogram ─────────────────────────────────────────────────── */
  .hist { display: flex; align-items: flex-end; gap: 12px; flex: 1; min-height: 150px; padding-top: 6px; }
  .hcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 7px; min-width: 0; }
  .hcol-n { font-size: 13px; font-weight: 700; color: var(--dir-ink); font-variant-numeric: tabular-nums; }
  .hcol-n.zero { color: var(--dir-faint); font-weight: 500; }
  .hcol-bar { width: 100%; max-width: 46px; border-radius: 7px 7px 3px 3px; background: var(--accent); transition: height 620ms cubic-bezier(0.22,0.61,0.36,1); }
  .hcol-x { font-size: 11px; color: var(--dir-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ── Source pie ───────────────────────────────────────────────────────────
     Rotated so the first wedge starts at twelve o'clock and reads clockwise.
     Hovering a wedge holds it and drops the rest back, so a share can be picked
     out of the circle without hunting for its colour in the legend. */
  .pie-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink: 0; }
  .pie { width: 168px; height: 168px; position: relative; }
  .pie svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .pie-seg {
    transition: stroke-dasharray 620ms cubic-bezier(0.22,0.61,0.36,1), opacity 160ms ease;
  }
  .pie:hover .pie-seg { opacity: 0.38; }
  .pie .pie-seg:hover { opacity: 1; }
  .pie-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; pointer-events: none;
  }
  .pie-center b { font-size: 24px; font-weight: 760; color: var(--dir-ink); letter-spacing: -0.02em; }
  .pie-center span { font-size: 10.5px; color: var(--dir-muted); margin-top: 1px; }
  .pie-caption { font-size: 12px; color: var(--dir-muted); text-align: center; }
  .pie-caption b { color: var(--dir-body); font-weight: 650; }
  /* A circular legend key for a circular chart; the square swatch is the bar
     charts' key and stays theirs. */
  .legend.is-pie .legend-row { padding: 9px 0; }
  .legend.is-pie .legend-dot { width: 11px; height: 11px; border-radius: 50%; }

  /* ── Email engagement funnel ───────────────────────────────────────────────
     Sent → Opened → Replied is a nested set, not a partition: nothing is opened
     that wasn't sent, and a reply implies an open. So it's three bars measured
     against one shared baseline, not the stacked bar the stage tile uses — a
     stack would claim these three are slices of a whole and that they sum. */
  /* One grid for all three rows, not a grid per row: the value column is auto-width,
     so per-row grids sized it to their own content — "1,240" is narrower than
     "643 (52%)" — and the 1fr track column pocketed the difference, which made the
     Sent bar's trough visibly longer than the two beneath it. `display: contents`
     lifts the rows' cells into this grid so all three share one set of columns. */
  .mail-fun {
    flex: 1; display: grid; grid-template-columns: 90px 1fr auto;
    align-content: center; align-items: center; gap: 14px 12px;
  }
  .mail-step { display: contents; }
  .mail-name { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dir-body); }
  /* Square key, same as the bar charts' legend — the round one belongs to the pie. */
  .mail-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  /* Both of these are display:block on purpose. They are spans inside a span, so
     without it the fill stays inline and width/height are simply ignored — which
     painted three empty tracks and no data at all. */
  .mail-track { display: block; height: 24px; border-radius: 6px; background: var(--dir-hair); overflow: hidden; }
  .mail-fill { display: block; height: 100%; border-radius: 6px; transition: width 620ms cubic-bezier(0.22,0.61,0.36,1); }
  .mail-val { text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* The count is the figure on every row, so the three are read against each other
     on one scale; the rate follows in brackets as what the bar already shows. */
  .mail-figure { font-size: 16px; font-weight: 740; color: var(--dir-ink); letter-spacing: -0.01em; }
  .mail-rate { font-size: 12px; color: var(--dir-muted); margin-left: 6px; }
  /* The figures are invented and not pipeline-scoped, neither of which a reader can
     tell from three bars. The footnote is the disclosure, so it isn't decoration. */
  .mail-foot { font-size: 11.5px; color: var(--dir-muted); margin-top: 15px; }

  /* ── Top opportunities ───────────────────────────────────────────────────── */
  .top-row { display: grid; grid-template-columns: 26px 1fr 132px auto; align-items: center; gap: 12px; padding: 9px 8px; margin: 0 -8px; border-radius: 10px; text-decoration: none; color: inherit; }
  .top-row + .top-row { border-top: 1px solid var(--dir-hair); }
  .top-row:hover { background: var(--dir-tint); }
  .top-rank { font-size: 12px; font-weight: 700; color: var(--dir-faint); text-align: center; font-variant-numeric: tabular-nums; }
  .top-deal { min-width: 0; }
  .top-deal-name { font-size: 13px; font-weight: 600; color: var(--dir-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-deal-co { font-size: 11.5px; color: var(--dir-muted); margin-top: 1px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-bar-wrap { min-width: 0; }
  .top-bar { height: 6px; border-radius: 3px; background: var(--dir-hair); overflow: hidden; }
  .top-bar-fill { height: 100%; border-radius: 3px; transition: width 560ms cubic-bezier(0.22,0.61,0.36,1); }
  .top-stage { font-size: 11px; color: var(--dir-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-val { font-size: 13px; font-weight: 700; color: var(--dir-ink); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  /* On a list ranked by attention rather than size, the figure is a staleness. */
  .top-val.is-late { color: #c0392b; }
  .top-rank { font-variant-numeric: tabular-nums; }
  @container dash (max-width: 560px) { .top-row { grid-template-columns: 22px 1fr auto; } .top-bar-wrap { display: none; } }

  .dash-empty { padding: 56px 18px; text-align: center; color: var(--dir-muted); font-size: 14px; }
  .dash-note { font-size: 12px; color: var(--dir-muted); padding: 16px 4px 0; }
  .dash-note a { color: var(--dir-accent); text-decoration: none; }

  /* Gentle first-paint rise; disabled under reduced-motion. */
  @keyframes tile-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .bento > .tile { animation: tile-in 320ms cubic-bezier(0.22,0.61,0.36,1) both; }

  /* The assistant's styles — the rail included — live in titan-assistant.css,
     because the same markup is also the floating panel on every other CRM page. */

  @media (prefers-reduced-motion: reduce) {
    .bento > .tile { animation: none; }
    .ring-val, .donut-seg, .stack-seg, .pie-seg, .top-bar-fill, .mail-fill, .hcol-bar { transition: none; }
    .ai-typing i { animation: none; }
  }

  /* Customize modal toggle rows */
  .dash-toggle { display: flex; align-items: flex-start; gap: var(--space-150); padding: var(--space-150) 0; cursor: pointer; }
  .dash-toggle + .dash-toggle { border-top: 1px solid var(--border-hairline); }
  .dash-toggle input {
    margin-top: var(--space-025); width: var(--checkbox-size); height: var(--checkbox-size);
    accent-color: var(--checkbox-accent); flex-shrink: 0; cursor: pointer;
  }
  /* Both of these are spans, so they need display:block to stack — without it the label and
     its description run together on one line ("Key metricsThe four headline numbers") and the
     margin-top below silently does nothing, which is exactly what was shipping. */
  .dash-toggle-name { display: block; font-size: var(--text-sm); font-weight: var(--weight-semi); color: var(--text-heading); }
  .dash-toggle-desc { display: block; font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--space-025); }
</style>
</head>
<body data-subpage="dashboard" data-sidebar-data="page">

<div class="app-window">
  <!-- The sidebar is one component: titan-sidebar.js renders it and owns its
       markup, rows and active state. Do not hand-maintain nav markup here. -->
  <div id="sidebar-mount"></div>

  <div class="main-area">
    <!-- No "< Back" header. The dashboard is a destination in the left nav, not a

<script src="/titan-assistant.js"></script>
<script>
  // ── Palette ────────────────────────────────────────────────────────────────
  // No categorical set here any more. Nothing on this board plots two or more
  // *series* — every tile is one measure over one dimension — so identity is
  // carried by position and the ordinal ramp, and a per-row hue would only have
  // restated the bar length in a second channel.
  const C_OPEN = '#2170f4', C_WON = '#2e9e7b', C_AVG = '#d98634', C_RATE = '#7a6ba3', C_DIST = '#4a8fc7';

  // ── Ordinal ramp ────────────────────────────────────────────────────────────
  // Ordered categories (pipeline stages) get one hue stepped light → dark. Doing
  // that by mixing the pipeline's colour with white does not work: the steps come
  // out too close to tell apart, and a pale green ends up invisible against a
  // white card. So the ramp is built in OKLCH, where lightness is perceptual and
  // can be stepped evenly, then converted back and gamut-clamped.
  //
  // Two constraints it holds to: each step sits ≥0.06 OKLCH-L from its
  // neighbours, and the palest step still clears 2:1 against the card. Both are
  // checked with the dataviz validator (7 hues × 2–9 stages, all passing) — the
  // gaps compress past 9 stages, which no pipeline here has.
  function srgbToLin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
  function linToSrgb(c) { return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055; }

  function hexToOklch(hex) {
    const s = String(hex || '').replace('#', '');
    const r = srgbToLin(parseInt(s.slice(0, 2), 16) || 0), g = srgbToLin(parseInt(s.slice(2, 4), 16) || 0), b = srgbToLin(parseInt(s.slice(4, 6), 16) || 0);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const q = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    const A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * q;
    const B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * q;
    return { L: 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * q, C: Math.sqrt(A * A + B * B), h: Math.atan2(B, A) };
  }
  function oklchToRgb(L, C, h) {
    const A = C * Math.cos(h), B = C * Math.sin(h);
    const l = Math.pow(L + 0.3963377774 * A + 0.2158037573 * B, 3);
    const m = Math.pow(L - 0.1055613458 * A - 0.0638541728 * B, 3);
    const q = Math.pow(L - 0.0894841775 * A - 1.2914855480 * B, 3);
    return [linToSrgb(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * q),
            linToSrgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * q),
            linToSrgb(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * q)];
  }
  function oklchToHex(L, C, h) {
    let lo = 0, hi = C;                                  // shrink chroma into gamut
    for (let i = 0; i < 18; i++) {
      const mid = (lo + hi) / 2;
      if (oklchToRgb(L, mid, h).every(function (v) { return v >= -0.001 && v <= 1.001; })) lo = mid; else hi = mid;
    }
    return '#' + oklchToRgb(L, lo, h).map(function (v) {
      return Math.max(0, Math.min(255, Math.round(v * 255))).toString(16).padStart(2, '0');
    }).join('');
  }
  function contrastOnWhite(hex) {
    const s = hex.replace('#', '');
    const c = [0, 2, 4].map(function (i) { return srgbToLin(parseInt(s.slice(i, i + 2), 16)); });
    return 1.05 / (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] + 0.05);
  }
  const RAMP_STEP = 0.075, RAMP_L_FLOOR = 0.26;
  function rampSteps(base, n) {
    const oc = hexToOklch(base);
    if (n < 2) return [base];
    // The pale end is hue-dependent — an equal-lightness green carries far more
    // luminance than a violet — so search for the lightest passing step per hue.
    let lo = 0.45, hi = 0.95;
    for (let i = 0; i < 20; i++) {
      const mid = (lo + hi) / 2;
      if (contrastOnWhite(oklchToHex(mid, oc.C, oc.h)) >= 2.05) lo = mid; else hi = mid;
    }
    const top = lo, bottom = Math.max(RAMP_L_FLOOR, top - (n - 1) * RAMP_STEP);
    const out = [];
    for (let i = 0; i < n; i++) out.push(oklchToHex(top - (top - bottom) * (i / (n - 1)), oc.C, oc.h));
    return out;
  }

  // Sections a reader can turn off. Order here is the render order. `money: true`
  // marks a section that only means something where records carry an amount — it
  // never appears on a hiring board.
  const WIDGETS = [
    { id: 'kpis',      name: 'Key metrics',        desc: 'The four headline numbers, completion rate included.' },
    { id: 'breakdown', name: 'Pipeline breakdown', desc: 'Where records sit, stage by stage.' },
    { id: 'distribution', name: 'Amount spread',   desc: 'How open records cluster by amount.', money: true },
    { id: 'sources',   name: 'By source',          desc: 'Where records came from (hidden until sources are set).' },
    { id: 'mail',      name: 'Email engagement',   desc: 'Sent, open rate and response rate across the mailbox.' },
    { id: 'top',       name: 'Focus list',         desc: 'The records worth opening first.' },
  ];
  function widgetsForType() {
    const money = activeType().money;
    return WIDGETS.filter(function (w) { return !w.money || money; });
  }

  // ── Preferences (persisted on DATA.dashboard, like contactFields) ───────────
  function prefs() {
    const d = (window.DATA && window.DATA.dashboard) || {};
    return { scope: d.scope || 'all', type: d.type || '', hidden: Array.isArray(d.hidden) ? d.hidden.slice() : [] };
  }
  async function savePrefs(patch) {
    window.DATA.dashboard = Object.assign({}, window.DATA.dashboard, patch);
    try { await window.saveData(); return true; } catch (e) { return false; }
  }
  function isShown(id) {
    if (prefs().hidden.indexOf(id) !== -1) return false;
    return widgetsForType().some(function (w) { return w.id === id; });
  }

  // ── Type + scope (in-memory overrides; prefs carry the saved default) ───────
  let scopeOverride = null, typeOverride = null;
  function pipelineList() {
    const p = (window.DATA && window.DATA.pipelines) || {};
    return Object.keys(p).map(function (id) { return p[id]; });
  }
  // Only the types actually present in this workspace get a tab.
  function typesPresent() {
    const seen = {};
    pipelineList().forEach(function (pl) { seen[window.pipelineTypeOf(pl).id] = true; });
    return window.PIPELINE_TYPES.filter(function (t) { return seen[t.id]; });
  }
  function activeType() {
    const present = typesPresent();
    if (!present.length) return window.PIPELINE_TYPES[0];
    const want = typeOverride != null ? typeOverride : prefs().type;
    return present.filter(function (t) { return t.id === want; })[0] || present[0];
  }
  // Every pipeline of the active type — the pool the scope select chooses from.
  function typePipelines() {
    const id = activeType().id;
    return pipelineList().filter(function (pl) { return window.pipelineTypeOf(pl).id === id; });
  }
  function currentScope() {
    const s = scopeOverride != null ? scopeOverride : prefs().scope;
    // A scope from another tab doesn't apply here.
    return typePipelines().some(function (p) { return p.id === s; }) ? s : 'all';
  }
  function scopedPipelines() {
    const all = typePipelines();
    const s = currentScope();
    if (s === 'all') return all;
    const one = all.filter(function (p) { return p.id === s; });
    return one.length ? one : all;
  }
  function hasMoney() { return activeType().money; }
  function scopedCards() {
    const out = [];
    scopedPipelines().forEach(function (pl) {
      (pl.cards || []).forEach(function (card) { out.push({ card: card, pipeline: pl }); });
    });
    return out;
  }
  function terminalKey(pl) { const s = pl.stages || []; return s.length ? s[s.length - 1].key : null; }

  // Outcome, not position. Stage is how far a record got; status is how it ended,
  // and they are independent — a deal can sit in the last stage still open, and can
  // be Lost from anywhere. This used to count "in the last stage" as finished, which
  // scored a Closed-and-Lost deal as a win and left a Lost deal parked mid-board
  // inflating the open pipeline. Read the outcome instead.
  function toneOf(entry) {
    // A pipeline with the status field switched off has no outcomes, so its records
    // all read as open rather than counting toward a rate they can't express.
    if (!window.titanSchema.on(entry.pipeline, 'status')) return 'open';
    const entity = entry.pipeline.entity;
    return titanStatus.toneOf(entity, titanStatus.current(entry.card, entity));
  }
  function isOpen(entry) { return titanStatus.isOpenTone(toneOf(entry)); }
  function isWon(entry)  { return toneOf(entry) === 'positive'; }
  function isLost(entry) { return toneOf(entry) === 'negative'; }
  // 'paused' (a project On hold) is deliberately none of the three: not active, not
  // an outcome. It stays in totals and out of the rate rather than skewing either.
  function stageLabel(pl, key) {
    return (pl.stages || []).reduce(function (acc, s) { return s.key === key ? s.label : acc; }, key || '');
  }

  function noun(n) {
    const set = {};
    scopedPipelines().forEach(function (pl) { if (pl.entity && pl.plural) set[pl.entity + '|' + pl.plural] = pl; });
    const keys = Object.keys(set);
    if (keys.length === 1) { const pl = set[keys[0]]; return n === 1 ? pl.entity.toLowerCase() : pl.plural.toLowerCase(); }
    return n === 1 ? 'record' : 'records';
  }

  // ── Money (per-symbol totals; never adds unlike currencies) ─────────────────
  function moneyByCurrency(entries) {
    const t = {};
    entries.forEach(function (e) { const cur = e.card.currency || window.defaultCurrency(); t[cur] = (t[cur] || 0) + (Number(e.card.value) || 0); });
    return t;
  }
  function moneyText(t) {
    const parts = Object.keys(t).filter(function (c) { return t[c] > 0; }).map(function (c) { return c + Number(t[c]).toLocaleString(); });
    return parts.length ? parts.join(' · ') : (window.defaultCurrency() + '0');
  }
  function sumValue(entries) { return entries.reduce(function (a, e) { return a + (Number(e.card.value) || 0); }, 0); }
  function dominantCurrency(entries) {
    const t = moneyByCurrency(entries); let cur = window.defaultCurrency(), best = -1;
    Object.keys(t).forEach(function (c) { if (t[c] > best) { best = t[c]; cur = c; } });
    return cur;
  }

  // ── Tile shell ──────────────────────────────────────────────────────────────
  function tile(opts) {
    const style = 'grid-column: span ' + (opts.span || 1) + '; --accent:' + (opts.accent || C_OPEN) + ';';
    return '<section class="tile" style="' + style + '">' +
      (opts.title ? '<div class="tile-head">' + '<span class="tile-title">' + esc(opts.title) + '</span>' +
        (opts.meta ? '<span class="tile-meta">' + esc(opts.meta) + '</span>' : '') + '</div>' : '') +
      opts.body + '</section>';
  }

  // ── KPI tiles ────────────────────────────────────────────────────────────────
  // Four numbers, one line of context each. Anything a reader would have to hold
  // two figures in their head to compare belongs in a chart below, not up here.
  function kpiTiles() {
    const all = scopedCards();
    const open = all.filter(isOpen);
    const won = all.filter(isWon), lost = all.filter(isLost);
    const pl = scopedPipelines()[0];
    // The winning outcome in this pipeline's own words — "Won" on a sales board,
    // "Hired" on a hiring one, "Fulfilled" on orders.
    const endLabel = titanStatus.positiveOf(pl && pl.entity);

    function kpi(o) {
      return '<div class="tile kpi" style="--accent:' + o.accent + '">' +
        '<div class="tile-head" style="margin-bottom:0"><span class="kpi-dot"></span><span class="kpi-label">' + esc(o.label) + '</span></div>' +
        '<div class="kpi-value" title="' + esc(o.value) + '">' + esc(o.value) + '</div>' +
        '<div class="kpi-sub">' + esc(o.sub) + '</div></div>';
    }
    // The completion rate as a number rather than a ring: "win rate" on a sales
    // board, "hire rate" on a hiring one. It replaced an Overdue count, which read
    // off a hand-authored boolean nothing in the app computes.
    // Out of *settled* records, not out of every record — a full pipeline of live
    // deals shouldn't drag the win rate down, since none of them have lost yet.
    const rateLabel = activeType().rateLabel;
    const settled = won.length + lost.length;
    const ratePct = settled ? Math.round((won.length / settled) * 100) : 0;
    const rateTile = kpi({ label: rateLabel, accent: C_RATE,
      value: settled ? ratePct + '%' : '—',
      sub: settled ? won.length + ' of ' + settled + ' settled' : 'nothing settled yet' });

    if (!hasMoney()) {
      // No amounts on this kind of pipeline, so the headline is where records are.
      // The stage before the finish line is the one that predicts the next result.
      const lastOpen = pl && (pl.stages || []).length > 1 ? (pl.stages || [])[(pl.stages || []).length - 2] : null;
      const inLast = lastOpen ? open.filter(function (e) { return e.card.stage === lastOpen.key; }) : [];
      return [
        kpi({ label: 'Active ' + noun(2), accent: C_OPEN,
          value: String(open.length), sub: 'of ' + all.length + ' total' }),
        lastOpen ? kpi({ label: lastOpen.label, accent: C_AVG,
          value: String(inLast.length), sub: 'nearly there' }) : '',
        kpi({ label: endLabel, accent: C_WON,
          value: String(won.length), sub: 'of ' + all.length + ' total' }),
        rateTile,
      ].join('');
    }

    const cur = dominantCurrency(all);
    const avg = all.length ? Math.round(sumValue(all) / all.length) : 0;
    // How amounts spread out is the Amount spread tile's job — up here the average
    // is just the average.
    return [
      kpi({ label: 'Open amount', accent: C_OPEN,
        value: moneyText(moneyByCurrency(open)), sub: open.length + ' open' }),
      kpi({ label: endLabel + ' amount', accent: C_WON,
        value: moneyText(moneyByCurrency(won)), sub: won.length + ' ' + endLabel.toLowerCase() }),
      kpi({ label: 'Avg amount', accent: C_AVG,
        value: cur + avg.toLocaleString(), sub: 'per ' + noun(1) }),
      rateTile,
    ].join('');
  }

  // ── Breakdown: funnel (one pipeline) or donut (several) ─────────────────────
  function breakdownTile(span) {
    const pls = scopedPipelines();
    return pls.length > 1 ? donutTile(pls, span) : funnelTile(pls[0], span);
  }

  // Stages are an ordered scale and every record sits in exactly one of them, so
  // the honest question is composition — what share of the pipeline is parked
  // where. That's one 100%-wide stacked bar, not a row of bars: a row of bars
  // invites reading stage-to-stage drop-off, which these numbers do not measure
  // (a stage count is who is sitting there now, not who passed through).
  //
  // Ordered categories get the ordinal ramp of the pipeline's own hue — earliest
  // stage lightest, last stage full strength. Interior segments have no free end
  // to label without clipping, so the counts ride the legend underneath instead.
  function funnelTile(pl, span) {
    if (!pl) return '';
    const money = hasMoney();
    const stages = pl.stages || [], cards = pl.cards || [];
    const rows = stages.map(function (st) {
      const inStage = cards.filter(function (c) { return c.stage === st.key; });
      return { label: st.label, count: inStage.length, value: inStage.reduce(function (a, c) { return a + (Number(c.value) || 0); }, 0),
        cur: (inStage[0] && inStage[0].currency) || window.defaultCurrency() };
    });
    const metric = function (r) { return money ? r.value : r.count; };
    const total = rows.reduce(function (a, r) { return a + metric(r); }, 0);
    const base = pl.color || C_OPEN;
    if (!total) return tile({ span: span, accent: base, title: 'By stage', meta: esc(pl.name),
      body: '<div class="dash-empty" style="padding:24px 0">Nothing in the pipeline yet.</div>' });

    const ramp = rampSteps(base, rows.length);
    const shade = function (i) { return ramp[i] || base; };
    const fmt = function (r) { return money ? r.cur + r.value.toLocaleString() : String(r.count); };
    const label = function (r) { return r.label + ' · ' + r.count + ' ' + noun(r.count) + (money ? ' · ' + r.cur + r.value.toLocaleString() : '') + ' · ' + Math.round((metric(r) / total) * 100) + '%'; };

    // flex-grow carries the share, so the 2px gaps never come out of the data.
    const bar = rows.map(function (r, i) {
      if (metric(r) <= 0) return '';
      return '<div class="stack-seg" style="flex:' + metric(r) + ' 0 0;background:' + shade(i) + '" title="' + esc(label(r)) + '"></div>';
    }).join('');
    const legend = rows.map(function (r, i) {
      return '<div class="legend-row" title="' + esc(label(r)) + '">' +
        '<span class="legend-dot" style="background:' + shade(i) + '"></span>' +
        '<span class="legend-name">' + esc(r.label) + '</span>' +
        '<span class="legend-val">' + esc(fmt(r)) + '</span>' +
        '<span class="legend-pct">' + Math.round((metric(r) / total) * 100) + '%</span>' +
      '</div>';
    }).join('');
    const body = '<div class="stackwrap">' +
      '<div class="stack" role="img" aria-label="Share of pipeline by stage">' + bar + '</div>' +
      '<div class="legend">' + legend + '</div></div>';
    return tile({ span: span, accent: base, title: 'By stage', meta: esc(pl.name), body: body });
  }

  // Several pipelines of the same kind in view: split them by open amount, or by
  // open headcount where there's no amount to split by.
  function donutTile(pls, span) {
    const money = hasMoney();
    const title = money ? 'Open amount by pipeline' : 'Open ' + noun(2) + ' by pipeline';
    const segs = pls.map(function (pl) {
      const open = (pl.cards || []).filter(function (c) { return isOpen({ card: c, pipeline: pl }); });
      return { name: pl.name, color: pl.color || C_OPEN,
        value: money ? open.reduce(function (a, c) { return a + (Number(c.value) || 0); }, 0) : open.length,
        cur: money ? ((open[0] && open[0].currency) || window.defaultCurrency()) : '' };
    }).filter(function (s) { return s.value > 0; }).sort(function (a, b) { return b.value - a.value; });

    if (!segs.length) return tile({ span: span, accent: C_OPEN, title: title, body: '<div class="dash-empty" style="padding:24px 0">Nothing open yet.</div>' });

    const total = segs.reduce(function (a, s) { return a + s.value; }, 0);
    const fmt = function (s, n) { return money ? s.cur + n.toLocaleString() : String(n); };
    let acc = 0;
    const ring = segs.map(function (s) {
      const pct = (s.value / total) * 100;
      const seg = '<circle class="donut-seg" cx="21" cy="21" r="15.9155" fill="none" stroke="' + esc(s.color) + '" stroke-width="6" stroke-dasharray="' + pct.toFixed(2) + ' ' + (100 - pct).toFixed(2) + '" stroke-dashoffset="' + (100 - acc).toFixed(2) + '"></circle>';
      acc += pct; return seg;
    }).join('');
    // The arc already carries the share, so the legend gives the figure only.
    const legend = segs.map(function (s) {
      return '<div class="legend-row"><span class="legend-dot" style="background:' + esc(s.color) + '"></span>' +
        '<span class="legend-name" title="' + esc(s.name) + '">' + esc(s.name) + '</span>' +
        '<span class="legend-val">' + esc(fmt(s, s.value)) + '</span></div>';
    }).join('');
    const body = '<div class="split"><div class="donut" role="img" aria-label="' + esc(title) + '">' +
      '<svg viewBox="0 0 42 42">' + ring + '</svg>' +
      '<div class="donut-center"><b>' + esc(fmt(segs[0], total)) + '</b><span>' + (money ? 'open amount' : 'open') + '</span></div></div>' +
      '<div class="legend">' + legend + '</div></div>';
    return tile({ span: span, accent: C_RATE, title: title, body: body });
  }

  // ── Amount histogram (open records) ─────────────────────────────────────────
  function distributionTile(span) {
    const open = scopedCards().filter(isOpen);
    if (!open.length) return '';
    const cur = dominantCurrency(open);
    const buckets = [
      { label: '<5k', lo: 0, hi: 5000 },
      { label: '5–10k', lo: 5000, hi: 10000 },
      { label: '10–25k', lo: 10000, hi: 25000 },
      { label: '25k+', lo: 25000, hi: Infinity },
    ];
    buckets.forEach(function (b) { b.n = 0; });
    open.forEach(function (e) {
      const v = Number(e.card.value) || 0;
      for (let i = 0; i < buckets.length; i++) { if (v >= buckets[i].lo && v < buckets[i].hi) { buckets[i].n++; break; } }
    });
    const max = Math.max(1, Math.max.apply(null, buckets.map(function (b) { return b.n; })));
    // Amount bands are an ordered scale, so they take the same validated ordinal
    // ramp as the stages — bigger amounts darker. It replaces an opacity fade,
    // which pushed the low band close enough to the card to stop reading as a mark.
    const ramp = rampSteps(C_DIST, buckets.length);
    const body = '<div class="hist">' + buckets.map(function (b, i) {
      const h = Math.round((b.n / max) * 118);
      return '<div class="hcol" title="' + b.n + ' ' + noun(b.n) + ' · ' + esc(cur + b.label) + '">' +
        '<span class="hcol-n' + (b.n ? '' : ' zero') + '">' + b.n + '</span>' +
        '<div class="hcol-bar" style="height:' + (b.n ? Math.max(h, 4) : 2) + 'px;background:' + ramp[i] + '"></div>' +
        '<span class="hcol-x">' + esc(cur + b.label) + '</span></div>';
    }).join('') + '</div>';
    return tile({ span: span, accent: C_DIST, title: 'Amount spread', meta: open.length + ' open', body: body });
  }

  // ── Tally over a nominal field (source) ──────────────────────────────────────
  // Ranks unordered categories by count. Not a set of distinct *series*, so no
  // categorical hue per row: one series, one colour.
  function tally(field) {
    const counts = {};
    scopedCards().forEach(function (e) {
      const v = String(e.card[field] || '').trim(); if (!v) return; counts[v] = (counts[v] || 0) + 1;
    });
    const keys = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });
    return { keys: keys, counts: counts, total: keys.reduce(function (a, k) { return a + counts[k]; }, 0),
      max: keys.length ? counts[keys[0]] : 0 };
  }

  // ── Source split (pie) ───────────────────────────────────────────────────────
  // Part-to-whole over a handful of nominal classes, so the wedges are categorical:
  // one hue per source, assigned in a fixed order so a source keeps its colour when
  // the set changes. The palette is the validated categorical order (adjacent CVD
  // separation and the lightness/chroma gates all pass on a white surface); three of
  // its slots sit under 3:1 against the card, which obliges visible labels — the
  // legend carries name, count and share, so no value is readable only as a wedge.
  //
  // Worth knowing about this form: close values are exactly what a pie is worst at.
  // Two sources at 2 each are two wedges nobody can tell apart by eye, which is why
  // every figure is also in the legend.
  // The deeper step of each validated hue rather than the bright one: same order,
  // same separation guarantees, but every slot also clears 3:1 against the card, so
  // the wedges read as considered colour instead of primaries.
  const PIE = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300'];
  const PIE_MAX = 6;

  function sourcePieTile(title, field, span, opts) {
    opts = opts || {};
    const t = tally(field);
    if (t.keys.length < (opts.min || 1)) return '';

    // Past six classes the wedges blur into each other, so the tail folds into one
    // "Other" rather than reaching for more hues.
    let keys = t.keys, counts = t.counts;
    if (keys.length > PIE_MAX) {
      const head = keys.slice(0, PIE_MAX - 1);
      const tail = keys.slice(PIE_MAX - 1);
      counts = {};
      head.forEach(function (k) { counts[k] = t.counts[k]; });
      counts['Other'] = tail.reduce(function (a, k) { return a + t.counts[k]; }, 0);
      keys = head.concat(['Other']);
    }
    const total = keys.reduce(function (a, k) { return a + counts[k]; }, 0);
    if (!total) return '';

    // The stroke is the ring: a circle of radius R stroked at width W paints the band
    // from R-W/2 to R+W/2, so these values put the ring between an inner 28 and an
    // outer 44 of the 100-unit box — a thin band with a hole wide enough for the
    // total to sit in it.
    //
    // Segments meet edge to edge, matching the pipeline donut. That leaves hue as the
    // only thing separating two neighbours, so the legend and the hover-to-isolate
    // below are doing real work rather than decorating — the palette's adjacent pairs
    // are validated for exactly this case.
    const R = 36, W = 16, C = 2 * Math.PI * R;
    let acc = 0;
    const wedges = keys.map(function (k, i) {
      const len = (counts[k] / total) * C;
      const seg = '<circle class="pie-seg" cx="50" cy="50" r="' + R + '" fill="none"' +
        ' stroke="' + PIE[i % PIE.length] + '" stroke-width="' + W + '"' +
        ' stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '"' +
        ' stroke-dashoffset="' + (-acc).toFixed(2) + '"></circle>';
      acc += len;
      return seg;
    }).join('');

    const legend = keys.map(function (k, i) {
      const pct = Math.round((counts[k] / total) * 100);
      return '<div class="legend-row" title="' + esc(k + ' · ' + counts[k] + ' of ' + total + ' · ' + pct + '%') + '">' +
        '<span class="legend-dot" style="background:' + PIE[i % PIE.length] + '"></span>' +
        '<span class="legend-name">' + esc(k) + '</span>' +
        '<span class="legend-val">' + counts[k] + '</span>' +
        '<span class="legend-pct">' + pct + '%</span>' +
      '</div>';
    }).join('');

    // One direct label rather than a number on every wedge: the leader is the only
    // reading a part-to-whole chart owes you at a glance.
    const lead = keys[0], leadPct = Math.round((counts[lead] / total) * 100);
    const body = '<div class="split">' +
      '<div class="pie-wrap">' +
        '<div class="pie" role="img" aria-label="' + esc(title) + '">' +
          '<svg viewBox="0 0 100 100">' + wedges + '</svg>' +
          '<div class="pie-center"><b>' + total + '</b><span>with a source</span></div>' +
        '</div>' +
        '<div class="pie-caption"><b>' + esc(lead) + '</b> leads at ' + leadPct + '%</div>' +
      '</div>' +
      '<div class="legend is-pie">' + legend + '</div></div>';
    // The total is in the ring now, so the header doesn't say it a second time.
    return tile({ span: span, accent: PIE[0], title: title, body: body });
  }

  // ── Email engagement ─────────────────────────────────────────────────────────
  // The one tile here whose figures are not computed from the records, because
  // nothing in this app tracks a send, an open or a reply. `card.activityType` is
  // the *type of the last touch* rather than a log, and there is no open signal at
  // all — so these are hand-authored demo figures, the way `card.overdue` already
  // is. Wiring it to something real means replacing MAIL_STATS with a fetch; the
  // rest of the tile reads whatever shape this object has.
  //
  // They are workspace-wide, which means they deliberately do NOT answer the
  // pipeline tabs or the scope selector above. That is the cost of a single mock
  // block, and the tile discloses it in its meta and its footnote rather than
  // redrawing the same three numbers under a new heading and implying they moved.
  // Per-pipeline figures would need a counter on each card instead.
  const MAIL_STATS = { sent: 1240, opened: 643, replied: 221, period: 'last 30 days' };

  // Three distinct hues rather than the ordinal ramp of one, which is the exception
  // to the note at the top of this section: a 3-step ramp of a single hue came out
  // too close to read, and these steps aren't just ordered, they carry a direction —
  // mail goes out (blue), gets attention (amber), comes back (green). The colour is
  // doing the same work as the label, which is the point.
  //
  // Both rates are shares of *sent*: "response rate" measured against opens would
  // flatter itself, and the two percentages would stop being comparable.
  function mailTile(span) {
    const sent = Math.max(0, Number(MAIL_STATS.sent) || 0);
    if (!sent) return '';
    // Clamped: a mock claiming more opens than sends would otherwise draw a bar past
    // the end of its track and report 118%.
    const steps = [
      { name: 'Sent', n: sent, color: C_OPEN, base: true },
      { name: 'Opened', n: Math.min(Math.max(0, Number(MAIL_STATS.opened) || 0), sent), color: C_AVG },
      { name: 'Replied', n: Math.min(Math.max(0, Number(MAIL_STATS.replied) || 0), sent), color: C_WON },
    ];
    const pct = function (st) { return Math.round((st.n / sent) * 100); };
    const rows = steps.map(function (st) {
      // Sent gets no bracket: it is the denominator, so "(100%)" of itself is noise.
      const rate = st.base ? '' : '<span class="mail-rate">(' + pct(st) + '%)</span>';
      return '<div class="mail-step">' +
        '<span class="mail-name"><span class="mail-dot" style="background:' + st.color + '"></span>' + esc(st.name) + '</span>' +
        '<span class="mail-track"><span class="mail-fill" style="width:' + pct(st) + '%;background:' + st.color + '"></span></span>' +
        '<span class="mail-val"><span class="mail-figure">' + st.n.toLocaleString() + '</span>' + rate + '</span>' +
      '</div>';
    }).join('');
    const spoken = steps.map(function (st) {
      return st.n.toLocaleString() + ' ' + st.name.toLowerCase() + (st.base ? '' : ' (' + pct(st) + '%)');
    }).join(', ');
    const body = '<div class="mail-fun" role="img" aria-label="Email engagement: ' + esc(spoken) + '">' + rows + '</div>' +
      '<div class="mail-foot">Mock data for now.</div>';
    return tile({ span: span, accent: C_OPEN, title: 'Email engagement',
      meta: 'All mail · ' + MAIL_STATS.period, body: body });
  }

  // ── Focus list ───────────────────────────────────────────────────────────────
  // What to open first. Where records carry an amount that's the biggest ones,
  // ranked with a bar. Where they don't, size means nothing — so it's the ones
  // waiting on you: overdue first, then furthest along.
  function topTile(span) {
    const money = hasMoney();
    const open = scopedCards().filter(isOpen);
    if (!open.length) return '';

    let rows, title, max = 1;
    if (money) {
      rows = open.slice().sort(function (a, b) { return (Number(b.card.value) || 0) - (Number(a.card.value) || 0); }).slice(0, 6);
      max = Math.max(1, Number(rows[0].card.value) || 0);
      title = 'Biggest open ' + noun(2);
    } else {
      const rank = function (e) {
        const stages = e.pipeline.stages || [];
        const at = stages.map(function (s) { return s.key; }).indexOf(e.card.stage);
        return (e.card.overdue ? -100 : 0) - at;          // overdue first, then furthest along
      };
      rows = open.slice().sort(function (a, b) { return rank(a) - rank(b); }).slice(0, 6);
      title = 'Needs you next';
    }

    const body = rows.map(function (e, i) {
      const c = e.card, pl = e.pipeline;
      const href = crmPath('/crm/pipeline/' + encodeURIComponent(pl.id) + '/record/' + encodeURIComponent(c.id));
      const w = Math.round(((Number(c.value) || 0) / max) * 100);
      // The name line is the record; underneath it, the company (sales) or the
      // person (hiring, where the record is already named for the role).
      const under = money ? (c.company || pl.name) : (c.contact || c.company || pl.name);
      return '<a class="top-row" href="' + href + '">' +
        '<span class="top-rank">' + (money ? (i + 1) : (c.overdue ? '!' : '·')) + '</span>' +
        '<span class="top-deal"><span class="top-deal-name" title="' + esc(c.deal || 'Untitled') + '">' + (esc(c.deal) || 'Untitled') + '</span>' +
          '<span class="top-deal-co"><span class="dir-chip-dot" style="background:' + esc(pl.color || C_OPEN) + '"></span>' + esc(under) + '</span></span>' +
        (money
          ? '<span class="top-bar-wrap"><span class="top-bar"><span class="top-bar-fill" style="width:' + w + '%;background:' + esc(pl.color || C_OPEN) + '"></span></span>' +
              '<span class="top-stage">' + esc(stageLabel(pl, c.stage)) + '</span></span>' +
            '<span class="top-val">' + esc(fmtMoney(c.value, c.currency)) + '</span>'
          : '<span class="top-bar-wrap"><span class="top-stage" style="margin-top:0">' + esc(stageLabel(pl, c.stage)) + '</span></span>' +
            '<span class="top-val' + (c.overdue ? ' is-late' : '') + '">' + esc(c.lastActivity || '') + '</span>') +
      '</a>';
    }).join('');
    return tile({ span: span, accent: C_AVG, title: title, body: body });
  }

  // ── Render ────────────────────────────────────────────────────────────────────
  function render() {
    const host = document.getElementById('d-content');
    if (!scopedCards().length) {
      host.innerHTML = '<div class="dash-empty">Nothing to chart yet — add records to a pipeline and they’ll show up here.</div>';
      return;
    }

    let html = '';
    if (isShown('kpis')) html += kpiTiles();

    // Chart tiles, paired two-up in this order: the stage/pipeline breakdown, then
    // the amount histogram (money boards only), then the source split. So a sales
    // board reads "open amount by pipeline" beside "amount spread", and a hiring
    // board reads "by stage" beside "by source". A lone tile at the end of an odd
    // count stretches to the full width rather than leaving half a row empty.
    const charts = [];
    if (isShown('breakdown')) charts.push(breakdownTile);
    if (isShown('distribution')) charts.push(distributionTile);
    if (isShown('sources')) charts.push(function (s) { return sourcePieTile('By source', 'source', s, { min: 2 }); });
    if (isShown('mail')) charts.push(mailTile);
    const rendered = charts.map(function (fn) { return { fn: fn, html: fn(2) }; }).filter(function (r) { return r.html; });
    if (rendered.length % 2 === 1) {
      const last = rendered[rendered.length - 1];
      last.html = last.fn(4);
    }
    html += rendered.map(function (r) { return r.html; }).join('');

    if (isShown('top')) html += topTile(4);

    html = html ? '<div class="bento">' + html + '</div>'
                : '<div class="dash-empty">Every section is hidden. Use <b>Customize</b> to bring some back.</div>';
    host.innerHTML = html;
    promoteLoneTile();
    animateBars(host);
  }

  // If a bento row ends with a single narrow tile (e.g. only the ring survived),
  // stretch it so the grid never shows a stranded half-column.
  function promoteLoneTile() {
    // Handled per-group above; this catches the ring-only headline edge.
    const tiles = document.querySelectorAll('.bento > .tile');
    // no-op placeholder kept intentionally simple — groups already balance.
    void tiles;
  }

  function animateBars(host) {
    requestAnimationFrame(function () {
      host.querySelectorAll('.top-bar-fill, .mail-fill').forEach(function (el) {
        const w = el.style.width; el.style.width = '0%'; requestAnimationFrame(function () { el.style.width = w; });
      });
      // The stacked bar grows out of the left edge.
      host.querySelectorAll('.stack-seg').forEach(function (el) {
        const g = el.style.flexGrow; el.style.flexGrow = '0'; requestAnimationFrame(function () { el.style.flexGrow = g; });
      });
      host.querySelectorAll('.hcol-bar').forEach(function (el) {
        const h = el.style.height; el.style.height = '2px'; requestAnimationFrame(function () { el.style.height = h; });
      });
      host.querySelectorAll('.ring-val').forEach(function (el) {
        const off = el.getAttribute('stroke-dashoffset'), C = el.getAttribute('stroke-dasharray');
        el.setAttribute('stroke-dashoffset', C); requestAnimationFrame(function () { el.setAttribute('stroke-dashoffset', off); });
      });
    });
  }

  // ── Type tabs ─────────────────────────────────────────────────────────────────
  function fillTabs() {
    const host = document.getElementById('d-tabs');
    const types = typesPresent(), active = activeType();
    // One kind of pipeline means there's nothing to switch between.
    host.style.display = types.length > 1 ? '' : 'none';
    if (types.length < 2) return;
    host.innerHTML = types.map(function (t) {
      return '<button class="dash-tab' + (t.id === active.id ? ' is-on' : '') + '" type="button" role="tab"' +
        ' aria-selected="' + (t.id === active.id) + '" data-type="' + esc(t.id) + '">' + esc(t.label) + '</button>';
    }).join('');
    host.querySelectorAll('.dash-tab').forEach(function (btn) {
      btn.onclick = function () {
        if (btn.dataset.type === activeType().id) return;
        typeOverride = btn.dataset.type;
        scopeOverride = 'all';            // a scope from the old tab means nothing here
        savePrefs({ type: typeOverride, scope: 'all' });
        fillTabs(); fillScope(); render(); refreshGreeting();
      };
    });
  }

  // ── Scope selector ────────────────────────────────────────────────────────────
  function fillScope() {
    const sel = document.getElementById('d-scope');
    const pls = typePipelines();
    const label = typesPresent().length > 1 ? 'All ' + activeType().label.toLowerCase() + ' pipelines' : 'All pipelines';
    sel.innerHTML = '<option value="all">' + esc(label) + '</option>' +
      pls.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('');
    sel.value = currentScope();
    sel.style.display = pls.length > 1 ? '' : 'none';
    sel.onchange = function () { scopeOverride = sel.value; render(); refreshGreeting(); };
  }

  // ── Customize modal ───────────────────────────────────────────────────────────
  function openCustomize() {
    const wrap = document.createElement('div');
    const hidden = prefs().hidden.slice();
    // Only what this kind of pipeline can actually show — no toggle for a section
    // that would render nothing.
    wrap.innerHTML = widgetsForType().map(function (w) {
      return '<label class="dash-toggle"><input type="checkbox" data-id="' + esc(w.id) + '"' + (hidden.indexOf(w.id) === -1 ? ' checked' : '') + '>' +
        '<span><span class="dash-toggle-name">' + esc(w.name) + '</span><span class="dash-toggle-desc">' + esc(w.desc) + '</span></span></label>';
    }).join('');
    openModal({
      title: 'Customize dashboard',
      note: 'Choose which sections show. Your choice is saved with this workspace.',
      body: wrap, confirmLabel: 'Save',
      onConfirm: async function (modal) {
        // Sections this tab can't show aren't in the modal, so carry their saved
        // state through untouched rather than reading them back as "on".
        const shown = widgetsForType().map(function (w) { return w.id; });
        const next = hidden.filter(function (id) { return shown.indexOf(id) === -1; });
        wrap.querySelectorAll('input[type=checkbox]').forEach(function (cb) { if (!cb.checked) next.push(cb.dataset.id); });
        modal.setBusy(true); modal.setStatus('Saving…');
        const ok = await savePrefs({ hidden: next });
        if (!ok) {
          window.DATA.dashboard = Object.assign({}, window.DATA.dashboard, { hidden: next });
          modal.setStatus('Saved for this session only — data API unreachable.', true);
          render(); setTimeout(modal.close, 900); return;
        }
        modal.close(); render();
      },
    });
  }

  // Names the current scope for the greeting: one pipeline by name, otherwise a
  // phrase. Lived in the copilot block and came out with it.
  function scopeName() {
    const pls = scopedPipelines();
    if (pls.length === 1) return pls[0].name;
    return typesPresent().length > 1 ? 'all ' + activeType().label.toLowerCase() + ' pipelines' : 'all pipelines';
  }

  // ── Ask Titan ───────────────────────────────────────────────────────────────
  // The engine is titan-assistant.js, shared with the floating button on every other
  // CRM page. What stays here is the half that is genuinely the dashboard's: a greeting
  // computed from the tiles' own numbers, and a redraw after a write so the tiles do
  // not quietly disagree with the record the user just changed.
  let assistant = null;

  // Everything the greeting can say, read once. `money` decides what "the most" means:
  // the biggest amount on a sales board, the busiest stage on one without amounts.
  function aiRead() {
    const money = hasMoney();
    const all = scopedCards(), open = all.filter(isOpen);
    const closed = all.filter(isWon), lost = all.filter(isLost);
    const overdue = open.filter(function (e) { return e.card.overdue; });
    const settled = closed.length + lost.length;
    const rate = settled ? Math.round((closed.length / settled) * 100) : 0;
    const byStage = {};
    open.forEach(function (e) {
      const l = stageLabel(e.pipeline, e.card.stage);
      if (!byStage[l]) byStage[l] = { v: 0, n: 0, cur: e.card.currency || window.defaultCurrency() };
      byStage[l].v += Number(e.card.value) || 0; byStage[l].n++;
    });
    return { money: money, all: all, open: open, closed: closed, overdue: overdue, rate: rate,
             openMoney: moneyText(moneyByCurrency(open)) };
  }

  // Numbers are read at render time, so this is rebuilt rather than restored — a
  // transcript from an hour ago shouldn't open with figures that look current.
  // `local` keeps it out of the history sent to the model: it is computed from the
  // tiles, so replaying it would just be the model reading its own summary back.
  function greetingMsg() {
    const d = aiRead();
    const T = window.titanAssistant;
    return { role: 'bot', local: true, greeting: true, html:
      '<p>Hi ' + esc(T.accountName().split(/\s+/)[0]) + ' — here’s a quick read on <b>' + esc(scopeName()) + '</b>.</p>' +
      (d.all.length ? T.aiTable(null,
        (d.money ? [['Open amount', d.openMoney]] : [['Active ' + noun(d.open.length), String(d.open.length)]])
          .concat([[activeType().rateLabel.replace(/^./, function (ch) { return ch.toUpperCase(); }), d.rate + '%'],
                   ['Overdue', String(d.overdue.length)]])) : '') +
      '<p>Ask me anything below, or tap a suggestion.</p>' };
  }

  // Swaps the greeting for one with current numbers and leaves the conversation alone.
  // Changing the pipeline dropdown used to wipe the transcript, which is a lot to lose
  // for glancing at another board — the scope never constrained the assistant anyway.
  function refreshGreeting() { if (assistant) assistant.refreshGreeting(); }

  function wireAssistant() {
    assistant = window.titanAssistant.create({
      els: {
        msgs: document.getElementById('ai-msgs'), chips: document.getElementById('ai-chips'),
        form: document.getElementById('ai-form'), text: document.getElementById('ai-text'),
        send: document.getElementById('ai-send'), newBtn: document.getElementById('ai-new'),
      },
      greeting: greetingMsg,
      // Tiles were computed from data fetched at load, so an applied change isn't in
      // them yet. Re-pull rather than leave the dashboard disagreeing with the record.
      onWrite: async function () { await fetchPipelineData(); render(); },
    });

    const rail = document.getElementById('ai-rail'), toggle = document.getElementById('d-ai-toggle');
    function setOpen(open) {
      rail.classList.toggle('is-hidden', !open);
      toggle.classList.toggle('is-on', open);
      toggle.setAttribute('aria-pressed', String(open));
    }
    toggle.addEventListener('click', function () { setOpen(rail.classList.contains('is-hidden')); });
    document.getElementById('ai-close').addEventListener('click', function () { setOpen(false); });
  }


  // ── Init ──────────────────────────────────────────────────────────────────────
  (async function init() {
    let data;
    try { data = await fetchPipelineData(); }
    catch (e) {
      document.getElementById('d-note').innerHTML = 'Couldn’t reach the CRM data API. <a href="' + crmPath('/crm') + '">Open Titan CRM</a>';
      return;
    }
    const pipelines = data.pipelines || {};
    window.titanSidebar.setPipelines(Object.keys(pipelines).map(function (id) { return pipelines[id]; }));

    fillTabs();
    fillScope();
    render();
    wireAssistant();
    document.getElementById('d-customize').addEventListener('click', openCustomize);
  })();
</script>
</body>
</html>
