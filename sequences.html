<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sequences — Titan CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/design-system/tokens.css">
<link rel="stylesheet" href="/design-system/components.css">
<link rel="stylesheet" href="/titan-sidebar.css">
<style>
  .seq-page {
    height: 100%; min-height: 0; overflow: hidden;
    background: var(--surface-page);
  }
  .seq-workspace {
    width: 100%; height: 100%; min-height: 0; display: grid;
    grid-template-columns: minmax(0, 10fr) minmax(0, 24fr); gap: 0;
  }
  .seq-library,
  .seq-editor {
    min-height: 0; overflow: hidden; display: flex; flex-direction: column;
  }
  .seq-library {
    padding: var(--space-400); border-right: var(--btn-border-width) solid var(--border-default);
    background: var(--surface-page);
  }
  .seq-library-head {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    width: min(100%, calc(var(--space-400) * 11)); margin-left: auto;
    gap: var(--space-100); margin-bottom: var(--space-300);
  }
  .seq-library-title {
    color: var(--text-heading); font-size: var(--text-lg); font-weight: var(--weight-semi);
  }
  .seq-editor {
    width: 100%; padding: 0;
    justify-self: stretch;
    background-color: color-mix(in srgb, var(--surface-primary) 35%, var(--surface-pressed));
    background-image: radial-gradient(
      circle,
      color-mix(in srgb, var(--text-muted) 14%, transparent) var(--btn-border-width),
      transparent var(--btn-border-width)
    );
    background-size: var(--space-200) var(--space-200);
  }
  .seq-list {
    width: min(100%, calc(var(--space-400) * 11)); min-height: 0; flex: 1 1 auto;
    margin-left: auto; overflow-y: auto; display: grid; align-content: start; gap: var(--space-150);
  }
  .seq-list-item {
    width: 100%; display: block; padding: var(--space-200);
    border: var(--btn-border-width) solid var(--border-subtle);
    border-radius: var(--radius-control); background: var(--surface-primary); text-align: left;
    color: inherit; font: inherit; cursor: pointer; transition: var(--motion-hover);
  }
  .seq-list-item:hover { border-color: var(--border-default); background: var(--surface-hover); }
  .seq-list-item.is-selected {
    border-color: var(--border-accent); background: var(--surface-selected);
  }
  .seq-list-name {
    color: var(--text-heading); font-size: var(--text-md);
    font-weight: var(--weight-semi); line-height: 1.35;
  }
  .seq-list-meta {
    margin-top: var(--space-125); display: flex; align-items: center;
    justify-content: space-between; gap: var(--space-100);
    color: var(--text-muted); font-size: var(--text-xs);
  }
  .seq-editor-scroll {
    min-height: 0; flex: 1 1 auto; overflow-y: auto; display: grid; align-content: start; justify-items: center;
    width: 100%; box-sizing: border-box;
    padding: calc(var(--space-400) + var(--space-100)) var(--space-300) var(--space-300);
  }
  .seq-flow-settings {
    width: min(100%, calc(var(--space-400) * 22)); margin-inline: auto;
    min-height: var(--input-height); display: flex; align-items: center;
    justify-content: space-between; gap: var(--space-200);
  }
  .seq-flow-heading {
    min-width: 0; display: flex; align-items: center; gap: var(--space-075);
  }
  .seq-flow-title {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-heading); font-size: var(--text-xl); font-weight: var(--weight-semi);
  }
  .seq-name-input { width: min(calc(var(--input-height) * 7), 50vw); }
  .seq-name-edit { flex: 0 0 auto; color: var(--text-secondary); }
  .seq-name-edit:hover { color: var(--text-accent); }
  .seq-name-edit[data-save-sequence-name] { color: var(--text-accent); }
  .seq-name-edit[data-save-sequence-name]:disabled { color: var(--text-disabled); }
  .seq-weekdays-setting {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: var(--space-125);
    color: var(--text-secondary); font-size: var(--text-sm); font-weight: var(--weight-semi);
    cursor: pointer;
  }
  .seq-switch {
    position: relative; width: calc(var(--space-400) + var(--space-050));
    height: calc(var(--space-200) + var(--space-050)); margin: 0;
    appearance: none; -webkit-appearance: none; cursor: pointer;
    border: var(--btn-border-width) solid var(--border-default); border-radius: var(--radius-full);
    background: var(--surface-recessed); transition: var(--motion-hover);
  }
  .seq-switch::after {
    content: ''; position: absolute; top: var(--space-025); left: var(--space-025);
    width: calc(var(--space-200) - var(--space-025)); height: calc(var(--space-200) - var(--space-025));
    border-radius: var(--radius-full); background: var(--surface-primary);
    box-shadow: var(--shadow-raise); transition: var(--motion-press);
  }
  .seq-switch:checked { border-color: var(--accent-primary); background: var(--accent-primary); }
  .seq-switch:checked::after { transform: translateX(var(--space-200)); }
  .seq-switch:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .seq-timeline {
    position: relative; display: grid; gap: calc(var(--space-400) + var(--space-200));
    width: min(100%, calc(var(--space-400) * 22)); margin: var(--space-300) auto 0;
  }
  .seq-timeline::before {
    content: ''; position: absolute; z-index: 0; left: calc(var(--btn-height) / 2);
    top: calc(var(--btn-height) / 2); bottom: calc(var(--btn-height) / 2); border-left: var(--btn-border-width) solid var(--border-default);
  }
  .seq-timeline-node {
    position: relative; z-index: 1; display: grid;
    grid-template-columns: var(--btn-height) minmax(0, 1fr); gap: var(--space-200);
  }
  .seq-start-node,
  .seq-condition-node,
  .seq-add-step-node,
  .seq-end-node { align-items: center; }
  .seq-start-marker,
  .seq-condition-marker,
  .seq-add-step-marker,
  .seq-end-marker {
    width: var(--space-100); height: var(--space-100); align-self: center; justify-self: center;
    border-radius: var(--radius-full);
  }
  .seq-start-marker { background: var(--accent-primary); }
  .seq-condition-marker { background: var(--label-amber-fg); }
  .seq-add-step-marker {
    width: calc(var(--space-200) + var(--space-050));
    height: calc(var(--space-200) + var(--space-050));
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent-primary); color: var(--text-on-accent); line-height: 0;
  }
  .seq-end-marker { background: var(--status-danger); }
  .seq-condition-node .seq-delay-panel { align-self: center; }
  .seq-step-marker {
    position: relative; z-index: 1; width: var(--btn-height); height: var(--btn-height);
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-full); background: var(--surface-recessed);
    color: var(--text-primary); font-size: var(--text-sm); font-weight: var(--weight-semi);
    box-shadow: inset 0 0 0 var(--btn-border-width) var(--border-default);
  }
  .seq-step-marker {
    margin-top: var(--space-025); background: var(--accent-subtle); color: var(--text-accent);
    box-shadow: inset 0 0 0 var(--btn-border-width) color-mix(in srgb, var(--accent-primary) 35%, var(--border-default));
  }
  .seq-start-copy {
    display: flex; align-items: center; gap: var(--space-125);
    min-height: var(--btn-height); color: var(--text-secondary); font-size: var(--text-sm);
  }
  .seq-start-copy strong { color: var(--text-heading); font-weight: var(--weight-semi); }
  .seq-step-group { display: grid; gap: calc(var(--space-400) + var(--space-200)); }
  .seq-delay-panel {
    width: fit-content; max-width: 100%; min-height: calc(var(--input-height) + var(--space-300));
    padding: var(--space-150) var(--space-200); justify-self: start;
    display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-150);
    border: var(--btn-border-width) solid color-mix(in srgb, var(--status-warning) 30%, var(--border-default));
    border-radius: var(--radius-control);
    background: color-mix(in srgb, var(--status-warning-subtle) 32%, var(--surface-primary));
  }
  .seq-wait-copy { color: var(--label-amber-fg); font-size: var(--text-sm); font-weight: var(--weight-semi); }
  .seq-wait-mode { width: calc(var(--input-height) * 5); flex: 0 1 auto; }
  .seq-wait-days { width: calc(var(--input-height) * 2); flex: 0 0 auto; }
  .seq-wait-unit { color: var(--label-amber-fg); font-size: var(--text-sm); }
  .seq-action-group { display: grid; gap: var(--space-200); }
  .seq-action-panel {
    padding: var(--space-300);
    border: calc(var(--btn-border-width) * 2) solid color-mix(in srgb, var(--accent-primary) 20%, var(--border-default));
    border-radius: var(--radius-control); background: var(--accent-subtle); box-shadow: none;
  }
  .seq-actions-list { display: grid; gap: var(--space-200); }
  .seq-action-item { display: grid; gap: var(--space-300); }
  .seq-action-type-row { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-100); }
  .seq-action-picker {
    height: auto; padding: 0; gap: 0; overflow: hidden; font-size: var(--text-sm);
    border: var(--btn-border-width) solid color-mix(in srgb, var(--accent-primary) 18%, var(--border-default));
    border-radius: var(--radius-control); background: var(--surface-primary);
  }
  .seq-action-picker > button {
    height: var(--btn-height-sm); padding: 0 var(--space-150); border-radius: 0;
  }
  .seq-action-picker > button + button { border-left: var(--btn-border-width) solid var(--border-default); }
  .seq-action-picker > button[aria-pressed="true"] { background: var(--accent-muted); box-shadow: none; }
  .seq-remove-action { margin-left: auto; flex: 0 0 auto; }
  .seq-add-action {
    display: flex; align-items: center;
  }
  .seq-action-empty {
    min-height: calc(var(--btn-height) + var(--space-200)); padding: var(--space-100) var(--space-150);
    display: flex; align-items: center; gap: var(--space-100);
    border-radius: var(--radius-control); background: var(--surface-recessed);
  }
  .seq-action-empty-copy {
    color: var(--text-secondary); font-size: var(--text-sm);
  }
  .seq-action-empty .seq-add-action { margin-left: auto; }
  .seq-remove-point { flex: 0 0 auto; }
  .seq-control-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-200);
  }
  .seq-control-wide { grid-column: 1 / -1; }
  .seq-field { display: grid; gap: var(--space-125); }
  .seq-field-label {
    color: var(--text-secondary); font-size: var(--text-sm); font-weight: var(--weight-semi);
  }
  .seq-reminder-builder {
    display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-100);
  }
  .seq-reminder-copy { color: var(--text-secondary); font-size: var(--text-sm); font-weight: var(--weight-semi); }
  .seq-reminder-offset { width: calc(var(--input-height) * 5); }
  .seq-reminder-days { width: calc(var(--input-height) * 2); }
  .seq-reminder-time { width: calc(var(--input-height) * 3); }
  .seq-template-control {
    position: relative; display: grid; gap: var(--space-150); padding: var(--space-200);
    border: var(--btn-border-width) solid var(--border-subtle);
    border-radius: var(--radius-control); background: var(--surface-primary);
  }
  .seq-template-heading {
    display: flex; align-items: center; gap: var(--space-100); min-height: var(--btn-height-sm);
  }
  .seq-template-selector {
    min-width: 0; max-width: 100%; padding-left: var(--space-050); color: var(--text-accent);
    font-size: var(--text-md); font-weight: var(--weight-semi);
  }
  .seq-template-selector:hover { color: var(--text-accent); background: var(--surface-selected); }
  .seq-template-selector .seq-template-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seq-template-view { margin-left: auto; flex: 0 0 auto; }
  .seq-timeline-node.has-open-template-menu { z-index: 1000; }
  .seq-template-menu {
    position: fixed; z-index: 2000;
    width: min(calc(var(--input-height) * 6), calc(100vw - (var(--space-300) * 2)));
    max-height: calc(100vh - (var(--space-300) * 2)); overflow-y: auto;
    display: grid; gap: var(--space-050); padding: var(--space-075);
    border: var(--btn-border-width) solid var(--border-default);
    border-radius: var(--radius-control); background: var(--surface-primary);
    box-shadow: var(--elevation-menu);
  }
  .seq-template-menu[hidden] { display: none; }
  .seq-template-option {
    width: 100%; padding: var(--space-100) var(--space-125); border: 0;
    border-radius: var(--radius-control); background: transparent; color: var(--text-primary);
    font: inherit; font-size: var(--text-sm); text-align: left; cursor: pointer;
  }
  .seq-template-option:hover { background: var(--surface-hover); }
  .seq-template-option[aria-selected="true"] { background: var(--surface-selected); color: var(--text-accent); font-weight: var(--weight-semi); }
  .seq-template-preview {
    overflow: hidden; border: var(--btn-border-width) solid var(--border-subtle);
    border-radius: var(--radius-control); background: var(--surface-recessed);
  }
  .seq-template-preview-toggle {
    width: 100%; min-height: var(--input-height); padding: var(--space-150) var(--space-200);
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-200);
    border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
    transition: var(--motion-hover);
  }
  .seq-template-preview-toggle:hover { background: var(--surface-hover); }
  .seq-template-preview-toggle:focus-visible {
    outline: none; box-shadow: inset 0 0 0 calc(var(--btn-border-width) * 2) var(--border-accent);
  }
  .seq-template-preview-action {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: var(--space-075);
    color: var(--text-accent); font-size: var(--text-xs); font-weight: var(--weight-semi);
  }
  .seq-template-preview-caret { transition: transform var(--dur-fast) var(--ease-standard); }
  .seq-template-preview-toggle[aria-expanded="true"] .seq-template-preview-caret { transform: rotate(180deg); }
  .seq-template-preview-body {
    display: grid; gap: var(--space-200); padding: var(--space-200);
    border-top: var(--btn-border-width) solid var(--border-subtle); background: var(--surface-primary);
  }
  .seq-template-preview-body[hidden] { display: none; }
  .seq-template-preview-recipient {
    display: flex; align-items: center; gap: var(--space-100);
    color: var(--text-secondary); font-size: var(--text-sm);
  }
  .seq-template-preview-label {
    color: var(--text-muted); font-size: var(--text-xs); font-weight: var(--weight-semi);
    text-transform: uppercase;
  }
  .seq-template-preview-content {
    color: var(--text-primary); font-size: var(--text-sm); line-height: 1.6;
  }
  .seq-template-subject { color: var(--text-heading); font-size: var(--text-sm); font-weight: var(--weight-semi); }
  .seq-add-step {
    position: relative; z-index: 1;
    padding: var(--space-300);
    border: var(--btn-border-width) solid color-mix(in srgb, var(--accent-primary) 35%, var(--border-default));
    border-radius: var(--radius-control);
    background: color-mix(in srgb, var(--accent-subtle) 55%, var(--surface-primary));
    box-shadow: var(--elevation-raise);
  }
  .seq-add-step-title { color: var(--text-accent); font-size: var(--text-sm); font-weight: var(--weight-semi); }
  .seq-add-step-actions { display: flex; flex-wrap: wrap; gap: var(--space-100); margin-top: var(--space-150); }
  .seq-add-step-choice {
    color: var(--text-accent); background: var(--surface-primary);
    border-color: color-mix(in srgb, var(--accent-primary) 30%, var(--border-default));
    box-shadow: var(--elevation-raise);
    transition: var(--motion-hover), transform var(--dur-fast) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard);
  }
  .seq-add-step-choice:hover {
    color: var(--text-accent); background: var(--accent-muted); border-color: var(--border-accent);
    transform: translateY(calc(var(--space-025) * -1)); box-shadow: var(--elevation-card);
  }
  .seq-add-step-choice:active { transform: translateY(0); }
  .seq-end-copy {
    min-height: var(--btn-height); display: flex; align-items: center;
    color: var(--text-heading); font-size: var(--text-sm); font-weight: var(--weight-semi);
  }
  .seq-template-dialog[hidden] { display: none; }
  .seq-template-dialog {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
    padding: var(--space-300);
  }
  .seq-dialog-backdrop { position: absolute; inset: 0; background: var(--modal-backdrop-bg); }
  .seq-dialog-panel {
    position: relative; width: min(calc(var(--space-400) * 15), 100%);
    max-height: 100%; overflow: hidden; display: flex; flex-direction: column;
    border-radius: var(--radius-control); background: var(--surface-primary);
    box-shadow: var(--elevation-modal);
  }
  .seq-dialog-head,
  .seq-dialog-foot { display: flex; align-items: center; gap: var(--space-150); padding: var(--space-200); }
  .seq-dialog-head { border-bottom: var(--btn-border-width) solid var(--border-subtle); }
  .seq-dialog-title { min-width: 0; flex: 1; color: var(--text-heading); font-size: var(--text-lg); font-weight: var(--weight-semi); }
  .seq-dialog-title:focus { outline: none; }
  .seq-dialog-body { min-height: 0; overflow-y: auto; padding: var(--space-300); background: var(--surface-page); }
  .seq-email-preview {
    overflow: hidden; border: var(--btn-border-width) solid var(--border-subtle);
    border-radius: var(--radius-control); background: var(--surface-primary);
  }
  .seq-email-subject-row {
    display: grid; gap: var(--space-050); padding: var(--space-150) var(--space-200);
    border-bottom: var(--btn-border-width) solid var(--border-subtle);
  }
  .seq-email-label { color: var(--text-muted); font-size: var(--text-xs); font-weight: var(--weight-semi); }
  .seq-email-subject,
  .seq-email-recipient { color: var(--text-heading); font-size: var(--text-md); font-weight: var(--weight-semi); line-height: 1.5; }
  .seq-email-content { padding: var(--space-300); color: var(--text-primary); font-size: var(--text-sm); line-height: 1.7; }
  .seq-merge-field {
    display: inline; padding: var(--space-025) var(--space-050); border-radius: var(--radius-sm);
    background: var(--surface-selected); color: var(--text-accent); font-weight: var(--weight-semi);
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  .seq-dialog-foot { justify-content: flex-end; border-top: var(--btn-border-width) solid var(--border-subtle); }
  .seq-empty {
    display: grid; place-items: center; min-height: 100%; color: var(--text-secondary);
    text-align: center; line-height: 1.5;
  }
  .seq-motion-status {
    position: absolute; width: var(--btn-border-width); height: var(--btn-border-width);
    padding: 0; margin: calc(var(--btn-border-width) * -1); overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; border: 0;
  }
</style>
</head>
<body data-subpage="sequences">
<div class="app-window">
  <div id="sidebar-mount"></div>
  <main class="main-area">
    <div class="subpage-body">
      <div class="seq-page">
        <div class="seq-workspace">
          <section class="seq-library" aria-label="Sequences">
            <div class="seq-library-head">
              <h1 class="seq-library-title">Your Sequences</h1>
              <button class="ds-btn ds-btn--primary ds-btn--sm" type="button" id="seq-create">
                <span data-ds-icon="plus" data-size="13"></span>
                New Sequence
              </button>
            </div>
            <div class="seq-list" id="seq-list"></div>
          </section>

          <section class="seq-editor" aria-label="Sequence editor">
            <div class="seq-editor-scroll" id="seq-editor"></div>
            <div class="seq-motion-status" id="seq-motion-status" role="status" aria-live="polite"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>
<div class="seq-template-dialog" id="seq-template-dialog" hidden>
  <div class="seq-dialog-backdrop" data-close-template-dialog></div>
  <section class="seq-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="seq-dialog-title">
    <header class="seq-dialog-head">
      <h2 class="seq-dialog-title" id="seq-dialog-title" tabindex="-1"></h2>
      <button class="ds-btn ds-btn--ghost ds-btn--icon ds-btn--sm" type="button" data-close-template-dialog aria-label="Close template preview">
        <span data-ds-icon="x" data-size="14"></span>
      </button>
    </header>
    <div class="seq-dialog-body" id="seq-dialog-body"></div>
    <footer class="seq-dialog-foot">
      <button class="ds-btn ds-btn--secondary ds-btn--sm" type="button" data-close-template-dialog>Close</button>
    </footer>
  </section>
</div>

<script src="/design-system/components/icon.js"></script>
<script src="/titan-sequences.js"></script>
<script src="/titan-sidebar.js"></script>
<script>
  const sequenceDrafts = window.titanSequenceLibrary.clone(window.titanSequenceLibrary.sequences);
  const templates = window.titanSequenceLibrary.templates;
  const REMINDER_OPTIONS = [
    { value: 'now', label: 'Immediately' },
    { value: '1-hour', label: 'In 1 hour' },
    { value: 'next-day', label: 'The next day' },
    { value: '2-days', label: 'In two days' },
    { value: '3-days', label: 'In three days' },
    { value: 'custom-days', label: 'Custom' },
  ];
  const DAY_REMINDER_OPTIONS = ['next-day', '2-days', '3-days', 'custom-days'];
  let selectedId = decodeURIComponent((location.hash || '').replace(/^#/, '')) ||
    new URLSearchParams(location.search).get('sequence') || (sequenceDrafts[0] && sequenceDrafts[0].id);
  let stepSequence = 100;
  let templateDialogTrigger = null;
  let editingSequenceId = null;
  let sequenceNameDraft = '';
  let timelineMotionBusy = false;
  const expandedTemplatePreviews = new Set();

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
    });
  }

  function selectedSequence() {
    return sequenceDrafts.find(function (sequence) { return sequence.id === selectedId; }) || null;
  }

  function writeSelection(id) {
    selectedId = id;
    editingSequenceId = null;
    sequenceNameDraft = '';
    const params = new URLSearchParams(location.search);
    params.delete('sequence');
    history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : '') + '#' + encodeURIComponent(id));
  }

  function renderLibrary() {
    const list = document.getElementById('seq-list');
    list.innerHTML = sequenceDrafts.map(function (sequence) {
      const active = sequence.id === selectedId;
      const stepCount = sequence.steps.length;
      const activeInstances = Math.max(0, Number(sequence.activeInstances) || 0);
      return '<button class="seq-list-item' + (active ? ' is-selected' : '') + '" type="button" data-sequence-id="' + esc(sequence.id) + '" aria-pressed="' + active + '">' +
        '<div class="seq-list-name">' + esc(sequence.name || 'Untitled sequence') + '</div>' +
        '<div class="seq-list-meta"><span>' + stepCount + (stepCount === 1 ? ' step' : ' steps') + '</span>' +
        '<span>' + activeInstances + ' active ' + (activeInstances === 1 ? 'instance' : 'instances') + '</span></div>' +
      '</button>';
    }).join('');
  }

  function delayControls(step, index) {
    const hasWait = step.timing !== 'immediate';
    const waitsForReply = step.timing === 'no-reply';
    return '<div class="seq-timeline-node seq-condition-node">' +
      '<span class="seq-condition-marker" aria-hidden="true"></span>' +
      '<div class="seq-delay-panel">' +
        '<span class="seq-wait-copy">Continue</span>' +
        '<select class="ds-input seq-wait-mode" id="seq-condition-' + index + '" data-step-condition="' + index + '" aria-label="When to continue">' +
          '<option value="no-reply"' + (waitsForReply ? ' selected' : '') + '>if no reply</option>' +
          '<option value="after"' + (step.timing === 'after' ? ' selected' : '') + '>after a delay</option>' +
          '<option value="immediate"' + (step.timing === 'immediate' ? ' selected' : '') + '>immediately</option>' +
        '</select>' +
        (hasWait ? '<span class="seq-wait-copy">' + (waitsForReply ? 'for' : 'of') + '</span><input class="ds-input seq-wait-days" id="seq-days-' + index + '" data-step-days="' + index + '" type="number" min="1" value="' + esc(step.days || 1) + '" aria-label="Number of days"><span class="seq-wait-unit">' + (Number(step.days) === 1 ? 'day' : 'days') + '</span>' : '') +
      '</div>' +
    '</div>';
  }

  function templatePreview(action, stepIndex, actionIndex) {
    const template = templates.find(function (item) { return item.id === action.templateId; }) || templates[0];
    if (!template) return '';
    const previewKey = selectedId + ':' + action.id;
    const previewId = 'seq-template-preview-' + stepIndex + '-' + actionIndex;
    const expanded = expandedTemplatePreviews.has(previewKey);
    return '<div class="seq-template-preview">' +
      '<button class="seq-template-preview-toggle" type="button" data-toggle-template-preview="' + esc(previewKey) + '" aria-expanded="' + expanded + '" aria-controls="' + previewId + '">' +
        '<span class="seq-template-subject">Subject: ' + esc(template.subject) + '</span>' +
        '<span class="seq-template-preview-action"><span data-template-preview-label>' + (expanded ? 'Collapse' : 'Expand') + '</span><span class="seq-template-preview-caret" data-ds-icon="caret-down" data-size="13"></span></span>' +
      '</button>' +
      '<div class="seq-template-preview-body" id="' + previewId + '"' + (expanded ? '' : ' hidden') + '>' +
        '<div class="seq-template-preview-recipient"><span class="seq-template-preview-label">To</span><span>' + renderTemplateText(template.to) + '</span></div>' +
        '<div class="seq-template-preview-content">' + renderTemplateText(template.body || template.preview) + '</div>' +
      '</div>' +
    '</div>';
  }

  function templatePicker(action, stepIndex, actionIndex) {
    const template = templates.find(function (item) { return item.id === action.templateId; }) || templates[0];
    if (!template) return '';
    const menuId = 'seq-template-menu-' + stepIndex + '-' + actionIndex;
    return '<div class="seq-template-control seq-control-wide">' +
      '<div class="seq-template-heading">' +
        '<button class="ds-btn ds-btn--ghost ds-btn--sm seq-template-selector" type="button" data-toggle-template-menu="' + stepIndex + '-' + actionIndex + '" aria-expanded="false" aria-haspopup="listbox" aria-controls="' + menuId + '"><span data-ds-icon="envelope" data-size="14"></span><span class="seq-template-name">' + esc(template.name) + '</span><span data-ds-icon="caret-down" data-size="13"></span></button>' +
        '<button class="ds-btn ds-btn--secondary ds-btn--sm seq-template-view" type="button" disabled>Add another template</button></div>' +
      '<div class="seq-template-menu" id="' + menuId + '" data-template-menu="' + stepIndex + '-' + actionIndex + '" role="listbox" aria-label="Email templates" hidden>' +
        templates.map(function (item) {
          return '<button class="seq-template-option" type="button" role="option" aria-selected="' + (item.id === template.id) + '" data-select-template="' + esc(item.id) + '" data-step-index="' + stepIndex + '" data-action-index="' + actionIndex + '">' + esc(item.name) + '</button>';
        }).join('') +
      '</div>' +
      templatePreview(action, stepIndex, actionIndex) +
    '</div>';
  }

  function actionControls(action, stepIndex, actionIndex) {
    const controlId = stepIndex + '-' + actionIndex;
    if (action.action === 'email') {
      return templatePicker(action, stepIndex, actionIndex);
    }
    const isCall = action.action === 'call';
    if (action.reminderOffset === '1-day') action.reminderOffset = 'next-day';
    if (action.reminderOffset === '1-week') {
      action.reminderOffset = 'custom-days';
      action.reminderDays = action.reminderDays || 7;
    }
    const reminderOffset = action.reminderOffset || 'next-day';
    const usesDay = DAY_REMINDER_OPTIONS.includes(reminderOffset);
    if (usesDay && !action.reminderTime) action.reminderTime = '09:00';
    if (reminderOffset === 'custom-days' && !action.reminderDays) action.reminderDays = 4;
    const reminderTime = action.reminderTime || '09:00';
    const reminderDays = Math.max(1, Number(action.reminderDays) || 4);
    return '<div class="seq-field seq-control-wide"><label class="seq-field-label" for="seq-title-' + controlId + '">' + (isCall ? 'Reminder title' : 'Task title') + '</label>' +
        '<input class="ds-input" id="seq-title-' + controlId + '" data-action-title data-step-index="' + stepIndex + '" data-action-index="' + actionIndex + '" value="' + esc(action.title || '') + '" placeholder="' + (isCall ? 'e.g. Call the new lead' : 'e.g. Prepare the proposal') + '"></div>' +
      '<div class="seq-reminder-builder seq-control-wide"><span class="seq-reminder-copy">Remind me</span>' +
        '<select class="ds-input seq-reminder-offset" id="seq-reminder-' + controlId + '" data-action-reminder data-step-index="' + stepIndex + '" data-action-index="' + actionIndex + '" aria-label="Reminder timing">' +
          REMINDER_OPTIONS.map(function (option) { return '<option value="' + option.value + '"' + (reminderOffset === option.value ? ' selected' : '') + '>' + option.label + '</option>'; }).join('') +
        '</select>' +
        (reminderOffset === 'custom-days' ? '<input class="ds-input seq-reminder-days" type="number" min="1" value="' + reminderDays + '" data-action-reminder-days data-step-index="' + stepIndex + '" data-action-index="' + actionIndex + '" aria-label="Custom reminder delay in days"><span class="seq-reminder-copy">days later</span>' : '') +
        (usesDay ? '<span class="seq-reminder-copy">at</span><input class="ds-input seq-reminder-time" type="time" value="' + esc(reminderTime) + '" data-action-reminder-time data-step-index="' + stepIndex + '" data-action-index="' + actionIndex + '" aria-label="Reminder time">' : '') +
      '</div>';
  }

  function renderAction(action, stepIndex, actionIndex) {
    return '<div class="ds-card seq-action-panel seq-action-item">' +
      '<div class="seq-action-type-row">' +
        '<div class="ds-segmented seq-action-picker" role="group" aria-label="Action ' + (actionIndex + 1) + ' in action box ' + (stepIndex + 1) + '">' +
          '<button type="button" data-set-action="email" data-step-index="' + stepIndex + '" data-action-index="' + actionIndex + '" aria-pressed="' + (action.action === 'email') + '"><span data-ds-icon="envelope" data-size="14"></span>Send an email</button>' +
          '<button type="button" data-set-action="call" data-step-index="' + stepIndex + '" data-action-index="' + actionIndex + '" aria-pressed="' + (action.action === 'call') + '"><span data-ds-icon="phone" data-size="14"></span>Set a call reminder</button>' +
          '<button type="button" data-set-action="task" data-step-index="' + stepIndex + '" data-action-index="' + actionIndex + '" aria-pressed="' + (action.action === 'task') + '"><span data-ds-icon="clipboard-text" data-size="14"></span>Create a task</button>' +
        '</div>' +
        '<button class="ds-btn ds-btn--ghost ds-btn--icon ds-btn--sm seq-remove-action" type="button" data-remove-action="' + actionIndex + '" data-step-index="' + stepIndex + '" title="Remove action"><span data-ds-icon="trash" data-size="14"></span></button>' +
      '</div>' +
      '<div class="seq-control-grid">' + actionControls(action, stepIndex, actionIndex) + '</div>' +
    '</div>';
  }

  function renderStep(step, index, total) {
    const addActionLabel = step.actions.length ? 'Add another action' : 'Add action';
    const addActionButton = '<button class="ds-btn ds-btn--secondary ds-btn--sm" type="button" data-add-action-to-step="' + index + '"><span data-ds-icon="plus" data-size="13"></span>' + addActionLabel + '</button>';
    const actionContent = step.actions.length ?
      '<div class="seq-actions-list">' + step.actions.map(function (action, actionIndex) { return renderAction(action, index, actionIndex); }).join('') + '</div>' +
      '<div class="seq-add-action">' + addActionButton + '</div>' :
      '<div class="seq-action-empty"><span class="seq-action-empty-copy">No actions yet</span><div class="seq-add-action">' + addActionButton + '</div>' +
        (total > 1 ? '<button class="ds-btn ds-btn--ghost ds-btn--icon ds-btn--sm seq-remove-point" type="button" data-remove-step="' + index + '" title="Remove empty point"><span data-ds-icon="trash" data-size="14"></span></button>' : '') + '</div>';
    return '<article class="seq-step-group" data-timeline-key="step-' + esc(step.id) + '">' +
      delayControls(step, index) +
      '<div class="seq-timeline-node">' +
        '<div class="seq-step-marker" aria-hidden="true">' + (index + 1) + '</div>' +
        '<div class="seq-action-group">' + actionContent + '</div>' +
      '</div>' +
    '</article>';
  }

  function renderEditor() {
    const host = document.getElementById('seq-editor');
    const sequence = selectedSequence();
    if (!sequence) {
      host.innerHTML = '<div class="seq-empty">Select a sequence to see its steps.</div>';
      return;
    }
    const weekdaysOnly = sequence.weekdaysOnly !== false;
    const editingName = editingSequenceId === sequence.id;
    host.innerHTML = '<div class="seq-flow-settings">' +
        '<div class="seq-flow-heading">' +
          (editingName ?
            '<input class="ds-input seq-name-input" type="text" data-sequence-name-input maxlength="80" value="' + esc(sequenceNameDraft) + '" aria-label="Sequence name">' +
            '<button class="ds-btn ds-btn--ghost ds-btn--icon ds-btn--sm seq-name-edit" type="button" data-save-sequence-name aria-label="Save sequence name"' + (sequenceNameDraft.trim() ? '' : ' disabled') + '><span data-ds-icon="check" data-size="14"></span></button>' :
            '<h2 class="seq-flow-title">' + esc(sequence.name || 'Untitled sequence') + '</h2>' +
            '<button class="ds-btn ds-btn--ghost ds-btn--icon ds-btn--sm seq-name-edit" type="button" data-edit-sequence-name aria-label="Edit sequence name"><span data-ds-icon="edit" data-size="14"></span></button>') +
        '</div>' +
        '<label class="seq-weekdays-setting" title="Skip Saturday and Sunday">' +
          '<span>Weekdays only</span>' +
          '<input class="seq-switch" type="checkbox" role="switch" data-weekdays-only aria-label="Run this sequence on weekdays only"' + (weekdaysOnly ? ' checked' : '') + '>' +
        '</label>' +
      '</div>' +
      '<div class="seq-timeline">' +
        '<div class="seq-timeline-node seq-start-node" data-timeline-key="start"><span class="seq-start-marker" aria-hidden="true"></span><div class="seq-start-copy"><strong>Start of sequence</strong></div></div>' +
        sequence.steps.map(function (step, index) { return renderStep(step, index, sequence.steps.length); }).join('') +
        '<div class="seq-timeline-node seq-add-step-node" data-timeline-key="add-step"><span class="seq-add-step-marker" aria-hidden="true"><span data-ds-icon="plus" data-size="12"></span></span>' +
          '<div class="seq-add-step"><div class="seq-add-step-title">Add another step</div><div class="seq-add-step-actions">' +
            '<button class="ds-btn ds-btn--secondary seq-add-step-choice" type="button" data-add-action-box="email"><span data-ds-icon="envelope" data-size="14"></span>Send an email</button>' +
            '<button class="ds-btn ds-btn--secondary seq-add-step-choice" type="button" data-add-action-box="call"><span data-ds-icon="phone" data-size="14"></span>Set a call reminder</button>' +
            '<button class="ds-btn ds-btn--secondary seq-add-step-choice" type="button" data-add-action-box="task"><span data-ds-icon="clipboard-text" data-size="14"></span>Create a task</button>' +
          '</div></div>' +
        '</div>' +
        '<div class="seq-timeline-node seq-end-node" data-timeline-key="end"><span class="seq-end-marker" aria-hidden="true"></span><div class="seq-end-copy">End of sequence</div></div>' +
      '</div>';
  }

  function renderAll() {
    renderLibrary();
    renderEditor();
  }

  function makeAction(type, templateIndex) {
    return {
      id: 'action-' + (++stepSequence),
      action: type,
      templateId: type === 'email' ? templates[templateIndex || 0].id : undefined,
      title: type === 'call' ? 'Follow-up call' : type === 'task' ? 'Follow up on this record' : undefined,
      reminderOffset: type === 'call' || type === 'task' ? 'next-day' : undefined,
      reminderTime: type === 'call' || type === 'task' ? '09:00' : undefined,
    };
  }

  function createSequence() {
    const id = 'sequence-' + Date.now();
    sequenceDrafts.unshift({
      id: id,
      name: 'Untitled sequence',
      description: 'Simple sales follow-up.',
      weekdaysOnly: true,
      activeInstances: 0,
      usedBy: [],
      steps: [{ id: 'step-' + (++stepSequence), timing: 'no-reply', days: 1, actions: [makeAction('email', 0)] }],
    });
    writeSelection(id);
    editingSequenceId = id;
    sequenceNameDraft = 'Untitled sequence';
    renderAll();
    const nameInput = document.querySelector('[data-sequence-name-input]');
    if (nameInput) { nameInput.focus(); nameInput.select(); }
  }

  function saveSequenceName() {
    const sequence = selectedSequence();
    const name = sequenceNameDraft.trim();
    if (!sequence || editingSequenceId !== sequence.id || !name) return;
    sequence.name = name;
    editingSequenceId = null;
    sequenceNameDraft = '';
    renderAll();
  }

  function positionTemplateMenu(trigger, menu) {
    const triggerRect = trigger.getBoundingClientRect();
    const gap = 8;
    const edge = 24;
    menu.style.top = '0px';
    menu.style.left = '0px';
    menu.hidden = false;
    const menuWidth = menu.offsetWidth;
    const menuHeight = menu.offsetHeight;
    const left = Math.max(edge, Math.min(triggerRect.left, window.innerWidth - menuWidth - edge));
    const below = triggerRect.bottom + gap;
    const above = triggerRect.top - menuHeight - gap;
    const top = below + menuHeight <= window.innerHeight - edge || above < edge ? below : above;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  }

  function closeTemplateMenus() {
    document.querySelectorAll('[data-template-menu]').forEach(function (item) { item.hidden = true; });
    document.querySelectorAll('[data-toggle-template-menu]').forEach(function (item) { item.setAttribute('aria-expanded', 'false'); });
    document.querySelectorAll('.has-open-template-menu').forEach(function (item) { item.classList.remove('has-open-template-menu'); });
  }

  function timelineMotionReduced() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function timelineItem(key) {
    return Array.from(document.querySelectorAll('[data-timeline-key]')).find(function (item) {
      return item.dataset.timelineKey === key;
    }) || null;
  }

  function captureTimelinePositions() {
    const positions = new Map();
    document.querySelectorAll('[data-timeline-key]').forEach(function (item) {
      positions.set(item.dataset.timelineKey, item.getBoundingClientRect().top);
    });
    return positions;
  }

  function announceTimelineChange(message) {
    const status = document.getElementById('seq-motion-status');
    status.textContent = '';
    window.requestAnimationFrame(function () { status.textContent = message; });
  }

  function waitForTimelineScroll() {
    if (timelineMotionReduced()) return Promise.resolve();
    return new Promise(function (resolve) { window.setTimeout(resolve, 280); });
  }

  function animateTimelineReflow(previousPositions, options) {
    options = options || {};
    return new Promise(function (resolve) {
      window.requestAnimationFrame(function () {
        const reduced = timelineMotionReduced();
        const animations = [];
        document.querySelectorAll('[data-timeline-key]').forEach(function (item) {
          const key = item.dataset.timelineKey;
          if (key === options.addedKey || !previousPositions.has(key)) return;
          const distance = previousPositions.get(key) - item.getBoundingClientRect().top;
          if (reduced || Math.abs(distance) < 1) return;
          animations.push(item.animate([
            { transform: 'translateY(' + distance + 'px)' },
            { transform: 'translateY(0)' },
          ], { duration: 380, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }));
        });

        const addedItem = options.addedKey ? timelineItem(options.addedKey) : null;
        if (addedItem && !reduced) {
          animations.push(addedItem.animate([
            { opacity: 0, transform: 'translateY(24px) scale(0.985)' },
            { opacity: 1, transform: 'translateY(0) scale(1)' },
          ], { duration: 440, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' }));
        }

        const focusItem = timelineItem(options.focusKey);
        if (focusItem) {
          focusItem.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' });
        }
        if (options.message) announceTimelineChange(options.message);
        if (!animations.length) {
          resolve();
          return;
        }
        Promise.all(animations.map(function (animation) {
          return animation.finished.catch(function () {});
        })).then(resolve);
      });
    });
  }

  async function removeStepWithMotion(sequence, index) {
    if (timelineMotionBusy || sequence.steps.length <= 1) return;
    const step = sequence.steps[index];
    const key = 'step-' + step.id;
    const item = timelineItem(key);
    timelineMotionBusy = true;
    try {
      if (item) {
        item.scrollIntoView({ behavior: timelineMotionReduced() ? 'auto' : 'smooth', block: 'center' });
        await waitForTimelineScroll();
      }
      const positions = captureTimelinePositions();
      if (item && !timelineMotionReduced()) {
        await item.animate([
          { opacity: 1, transform: 'translateY(0) scale(1)' },
          { opacity: 0, transform: 'translateY(-16px) scale(0.98)' },
        ], { duration: 240, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }).finished.catch(function () {});
      }
      sequence.steps.splice(index, 1);
      const focusKey = sequence.steps[index] ? 'step-' + sequence.steps[index].id : 'add-step';
      renderAll();
      await animateTimelineReflow(positions, { focusKey: focusKey, message: 'Step removed' });
    } finally {
      timelineMotionBusy = false;
    }
  }

  function renderTemplateText(value) {
    const labels = {
      'name': 'Name',
      'email': 'Email',
    };
    return String(value || '').split(/(\{\{[^}]+\}\})/g).map(function (part) {
      const match = part.match(/^\{\{\s*([^}]+?)\s*\}\}$/);
      if (match) {
        const key = match[1];
        return '<span class="seq-merge-field" title="' + esc(part) + '">' + esc(labels[key] || key) + '</span>';
      }
      return esc(part).replace(/\n/g, '<br>');
    }).join('');
  }

  function openTemplateDialog(templateId, trigger) {
    const template = templates.find(function (item) { return item.id === templateId; });
    if (!template) return;
    closeTemplateMenus();
    const dialog = document.getElementById('seq-template-dialog');
    templateDialogTrigger = trigger;
    document.getElementById('seq-dialog-title').textContent = template.name;
    document.getElementById('seq-dialog-body').innerHTML =
      '<div class="seq-email-preview">' +
        '<div class="seq-email-subject-row"><span class="seq-email-label">To</span><div class="seq-email-recipient">' + renderTemplateText(template.to) + '</div></div>' +
        '<div class="seq-email-subject-row"><span class="seq-email-label">Subject</span><div class="seq-email-subject">' + renderTemplateText(template.subject) + '</div></div>' +
        '<div class="seq-email-content">' + renderTemplateText(template.body || template.preview) + '</div>' +
      '</div>';
    dialog.hidden = false;
    document.querySelector('.app-window').inert = true;
    document.body.style.overflow = 'hidden';
    document.getElementById('seq-dialog-title').focus();
  }

  function closeTemplateDialog() {
    const dialog = document.getElementById('seq-template-dialog');
    if (dialog.hidden) return;
    dialog.hidden = true;
    document.querySelector('.app-window').inert = false;
    document.body.style.overflow = '';
    if (templateDialogTrigger) templateDialogTrigger.focus();
    templateDialogTrigger = null;
  }

  document.getElementById('seq-create').addEventListener('click', createSequence);
  document.getElementById('seq-list').addEventListener('click', function (event) {
    const row = event.target.closest('[data-sequence-id]');
    if (!row) return;
    writeSelection(row.dataset.sequenceId);
    renderAll();
  });

  document.getElementById('seq-editor').addEventListener('input', function (event) {
    const sequence = selectedSequence();
    if (!sequence) return;
    if (event.target.dataset.sequenceNameInput !== undefined) {
      sequenceNameDraft = event.target.value;
      const save = document.querySelector('[data-save-sequence-name]');
      if (save) save.disabled = !sequenceNameDraft.trim();
    } else if (event.target.dataset.actionTitle !== undefined) {
      sequence.steps[Number(event.target.dataset.stepIndex)].actions[Number(event.target.dataset.actionIndex)].title = event.target.value;
    } else if (event.target.dataset.actionReminderDays !== undefined) {
      sequence.steps[Number(event.target.dataset.stepIndex)].actions[Number(event.target.dataset.actionIndex)].reminderDays = Math.max(1, Number(event.target.value) || 1);
    }
    const daysIndex = event.target.dataset.stepDays;
    if (daysIndex !== undefined) sequence.steps[Number(daysIndex)].days = Math.max(1, Number(event.target.value) || 1);
  });

  document.getElementById('seq-editor').addEventListener('change', function (event) {
    const sequence = selectedSequence();
    if (!sequence) return;
    let index;
    if (event.target.dataset.weekdaysOnly !== undefined) {
      sequence.weekdaysOnly = event.target.checked;
    } else if (event.target.dataset.stepCondition !== undefined) {
      index = Number(event.target.dataset.stepCondition);
      sequence.steps[index].timing = event.target.value;
      if (event.target.value !== 'immediate' && !sequence.steps[index].days) sequence.steps[index].days = 1;
      renderEditor();
    } else if (event.target.dataset.actionReminder !== undefined) {
      const action = sequence.steps[Number(event.target.dataset.stepIndex)].actions[Number(event.target.dataset.actionIndex)];
      action.reminderOffset = event.target.value;
      if (DAY_REMINDER_OPTIONS.includes(action.reminderOffset) && !action.reminderTime) action.reminderTime = '09:00';
      if (action.reminderOffset === 'custom-days' && !action.reminderDays) action.reminderDays = 4;
      renderEditor();
    } else if (event.target.dataset.actionReminderTime !== undefined) {
      sequence.steps[Number(event.target.dataset.stepIndex)].actions[Number(event.target.dataset.actionIndex)].reminderTime = event.target.value;
    } else if (event.target.dataset.stepDays !== undefined) {
      renderEditor();
    }
  });

  document.getElementById('seq-editor').addEventListener('click', async function (event) {
    const sequence = selectedSequence();
    if (!sequence) return;
    const editSequenceName = event.target.closest('[data-edit-sequence-name]');
    if (editSequenceName) {
      editingSequenceId = sequence.id;
      sequenceNameDraft = sequence.name || '';
      renderEditor();
      const input = document.querySelector('[data-sequence-name-input]');
      if (input) { input.focus(); input.select(); }
      return;
    }
    if (event.target.closest('[data-save-sequence-name]')) {
      saveSequenceName();
      return;
    }
    const toggleTemplateMenu = event.target.closest('[data-toggle-template-menu]');
    if (toggleTemplateMenu) {
      const menu = document.getElementById(toggleTemplateMenu.getAttribute('aria-controls'));
      const willOpen = menu.hidden;
      closeTemplateMenus();
      if (willOpen) {
        const timelineNode = toggleTemplateMenu.closest('.seq-timeline-node');
        if (timelineNode) timelineNode.classList.add('has-open-template-menu');
        positionTemplateMenu(toggleTemplateMenu, menu);
      }
      toggleTemplateMenu.setAttribute('aria-expanded', String(willOpen));
      return;
    }
    const selectTemplate = event.target.closest('[data-select-template]');
    if (selectTemplate) {
      sequence.steps[Number(selectTemplate.dataset.stepIndex)].actions[Number(selectTemplate.dataset.actionIndex)].templateId = selectTemplate.dataset.selectTemplate;
      renderEditor();
      return;
    }
    const previewTemplate = event.target.closest('[data-preview-template]');
    if (previewTemplate) {
      openTemplateDialog(previewTemplate.dataset.previewTemplate, previewTemplate);
      return;
    }
    const toggleTemplatePreview = event.target.closest('[data-toggle-template-preview]');
    if (toggleTemplatePreview) {
      const previewKey = toggleTemplatePreview.dataset.toggleTemplatePreview;
      const expanded = toggleTemplatePreview.getAttribute('aria-expanded') !== 'true';
      const previewBody = document.getElementById(toggleTemplatePreview.getAttribute('aria-controls'));
      toggleTemplatePreview.setAttribute('aria-expanded', String(expanded));
      if (expanded) expandedTemplatePreviews.add(previewKey);
      else expandedTemplatePreviews.delete(previewKey);
      if (previewBody) previewBody.hidden = !expanded;
      const previewLabel = toggleTemplatePreview.querySelector('[data-template-preview-label]');
      if (previewLabel) previewLabel.textContent = expanded ? 'Collapse' : 'Expand';
      return;
    }
    const setAction = event.target.closest('[data-set-action]');
    if (setAction) {
      const action = sequence.steps[Number(setAction.dataset.stepIndex)].actions[Number(setAction.dataset.actionIndex)];
      action.action = setAction.dataset.setAction;
      if (action.action === 'email' && !action.templateId) action.templateId = templates[0].id;
      if ((action.action === 'call' || action.action === 'task') && !action.reminderOffset) {
        action.reminderOffset = 'next-day';
        action.reminderTime = '09:00';
      }
      renderAll();
      return;
    }
    const addActionToStep = event.target.closest('[data-add-action-to-step]');
    if (addActionToStep) {
      sequence.steps[Number(addActionToStep.dataset.addActionToStep)].actions.push(makeAction('email', 0));
      renderAll();
      return;
    }
    const removeAction = event.target.closest('[data-remove-action]');
    if (removeAction) {
      const actions = sequence.steps[Number(removeAction.dataset.stepIndex)].actions;
      actions.splice(Number(removeAction.dataset.removeAction), 1);
      renderAll();
      return;
    }
    const addActionBox = event.target.closest('[data-add-action-box]');
    if (addActionBox) {
      if (timelineMotionBusy) return;
      timelineMotionBusy = true;
      const actionType = addActionBox.dataset.addActionBox;
      const positions = captureTimelinePositions();
      const newStep = {
        id: 'step-' + (++stepSequence), timing: 'no-reply', days: 1,
        actions: [makeAction(actionType, actionType === 'email' ? 1 : 0)],
      };
      sequence.steps.push(newStep);
      renderAll();
      try {
        await animateTimelineReflow(positions, {
          addedKey: 'step-' + newStep.id,
          focusKey: 'step-' + newStep.id,
          message: 'Step added',
        });
      } finally {
        timelineMotionBusy = false;
      }
      return;
    }
    const remove = event.target.closest('[data-remove-step]');
    if (remove && sequence.steps.length > 1) {
      await removeStepWithMotion(sequence, Number(remove.dataset.removeStep));
      return;
    }
  });

  document.getElementById('seq-template-dialog').addEventListener('click', function (event) {
    if (event.target.closest('[data-close-template-dialog]')) closeTemplateDialog();
  });
  document.addEventListener('click', function (event) {
    if (event.target.closest('.seq-template-control')) return;
    closeTemplateMenus();
  });
  document.addEventListener('keydown', function (event) {
    const dialog = document.getElementById('seq-template-dialog');
    if (dialog.hidden) {
      if (event.target.matches('[data-sequence-name-input]') && event.key === 'Enter') {
        event.preventDefault();
        saveSequenceName();
        return;
      }
      if (event.target.matches('[data-sequence-name-input]') && event.key === 'Escape') {
        event.preventDefault();
        editingSequenceId = null;
        sequenceNameDraft = '';
        renderEditor();
        return;
      }
      if (event.key === 'Escape') {
        closeTemplateMenus();
      }
      return;
    }
    if (event.key === 'Escape') {
      event.preventDefault();
      closeTemplateDialog();
      return;
    }
    if (event.key !== 'Tab') return;
    const focusable = Array.from(dialog.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'));
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  document.getElementById('seq-editor').addEventListener('scroll', function () {
    closeTemplateMenus();
  });
  window.addEventListener('resize', function () {
    closeTemplateMenus();
  });

  if (!selectedSequence() && sequenceDrafts.length) writeSelection(sequenceDrafts[0].id);
  renderAll();
</script>
</body>
</html>
