<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms — Titan CRM</title>
<!-- Persona loader: ?u=<id> scopes the /api/data fetch and loads personas/<id>.js. -->
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('u');
    var u = (raw && /^[a-z0-9_-]{1,32}$/.test(raw)) ? raw.toLowerCase() : null;
    if (u) document.write('<' + 'script src="/personas/' + u + '.js"><' + '/script>');
  })();
</script>
  <!-- Design system tokens. Everything below can use --text-primary, --accent-primary,
       and the bridged --dir-* names; see design-system/DESIGN-SYSTEM.md. -->
<link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
<link rel="stylesheet" href="/titan-sidebar.css">
<link rel="stylesheet" href="/crm-directory.css">
<link rel="stylesheet" href="/form.css">
<link rel="stylesheet" href="/form-builder.css">
<style>
  /* Each pipeline is a folder tab; the card hanging off it is that pipeline's form.
     The tab carries the pipeline name so "which pipeline?" is answered before you
     read anything about the form — a form belongs to a pipeline, and the tab says so
     structurally rather than in a line of sub-text. */
  .fl-wrap { padding: 20px 22px 60px; max-width: 880px; }

  .fl-group { margin-bottom: 18px; }
  .fl-tab {
    display: inline-flex; align-items: center; gap: 9px; position: relative;
    /* Sits flush on the card: the tab's left border continues the card's, and its
       bottom border is dropped so the two read as one shape rather than a label
       parked next to a box. `top: 1px` overlaps the card's top hairline. */
    top: 1px; margin-left: 0; padding: 10px 16px 12px;
    font-size: 13.5px; font-weight: 650; color: var(--dir-ink);
    /* Tinted in the pipeline's own colour rather than left white: the tab is the
       label for everything under it, and a white tab on a white card was a shape you
       had to look for. --tab-tint is set per group from pl.color. */
    background: var(--tab-tint, var(--dir-hair)); border: 1px solid var(--tab-line, var(--dir-line));
    border-bottom: none; border-radius: 11px 11px 0 0; max-width: 100%;
  }
  .fl-tab-glyph { flex-shrink: 0; display: block; }
  .fl-tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .fl-card {
    background: var(--dir-surface); border: 1px solid var(--dir-line);
    border-radius: 0 13px 13px 13px; padding: 16px 17px;
    display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 14px; align-items: center;
  }
  .fl-icon {
    width: 42px; height: 42px; border-radius: 11px; display: inline-flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .fl-main { min-width: 0; }
  .fl-name { font-size: 14.5px; font-weight: 650; color: var(--dir-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fl-meta { font-size: 12.5px; color: var(--dir-muted); margin-top: 3px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .fl-meta b { color: var(--dir-body); font-weight: 650; }
  .fl-sep { color: var(--dir-faint); }
  .fl-state { font-weight: 650; }
  .fl-state.on { color: #1e8e3e; }
  .fl-state.off { color: var(--dir-muted); }

  .fl-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
  .fl-btn {
    height: 36px; padding: 0 14px; border: 1px solid var(--dir-line); border-radius: 10px;
    background: var(--dir-surface); font: inherit; font-size: 13px; font-weight: 600;
    color: var(--dir-body); cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .fl-btn:hover { border-color: var(--dir-accent); color: var(--dir-accent); }
  .fl-btn.icon { width: 36px; padding: 0; }
  .fl-btn.icon.is-done { border-color: #1e8e3e; color: #1e8e3e; }
  /* Quiet until you go for it: delete sits in a row of everyday actions, so it reads as
     one of them and only turns red on hover. Same tokens as ds-btn--destructive-quiet. */
  .fl-btn.danger:hover { border-color: var(--border-danger); color: var(--status-danger); background: var(--status-danger-subtle); }
  .fl-empty { font-size: 13.5px; color: var(--dir-muted); padding: 4px 0 10px; }
</style>
</head>
<body class="subpage-body" data-subpage="forms" data-sidebar-data="page">

<div class="app-window">
  <!-- The sidebar is one component: titan-sidebar.js renders it. -->
  <div id="sidebar-mount"></div>

  <div class="main-area">
    <div class="subpage-top">
      <!-- No back link: this is a top-level destination in its own right, reached from
           the sidebar, which is also how you leave it. A back arrow here implied it was
           somewhere you'd arrived at from the board. -->
      <span class="subpage-title">Forms</span>
    </div>

    <div class="fl-wrap">
      <div id="fl-live"></div>
      <div class="dir-note" id="fl-note"></div>
    </div>
  </div>
</div>

<script src="/design-system/components/icon.js"></script>
<script src="/titan-sidebar.js"></script>
<script src="/crm-directory.js"></script>
<!-- The builder labels each field's destination in the record's own words, which
     crm-schema.js owns — without it the rows fall back to generic names. -->
<script src="/crm-schema.js"></script>
<script src="/form-render.js"></script>
<!-- dsMenu drives the field-destination picker inside form-builder.js: one open at a
     time, outside click, Escape, arrow keys. -->
<script src="/design-system/components/menu.js"></script>
<!-- Pipeline tag names the pipeline in the builder's destination picker. -->
<script src="/design-system/components/pipeline-tag.js"></script>
<script src="/form-builder.js"></script>
<script>
  const esc = window.esc;

  function formUrlFor(token) { return location.origin + '/f/' + encodeURIComponent(token); }

  function submissionsFor(pl, form) {
    const label = (form && form.sourceLabel) || 'Form';
    return (pl.cards || []).filter(function (c) {
      return c.createdBy === 'Form' || c.source === label;
    }).length;
  }

  // The same mark the sidebar uses for a pipeline row, so a tab and its nav entry are
  // recognisably the same thing. A generic coloured square said "some category".
  function pipelineGlyph(colour) {
    return '<svg class="fl-tab-glyph" width="13" height="13" viewBox="0 0 14 14" fill="none">' +
      '<path d="M2 3.2H9.6L12.4 7L9.6 10.8H2L4.4 7L2 3.2Z" fill="' + esc(colour || '#2170f4') + '"/></svg>';
  }

  const ICON_FORM = '<span data-ds-icon="forms" data-size="20"></span>';
  const ICON_OPEN = '<span data-ds-icon="open-external" data-size="15"></span>';
  const ICON_COPY = '<span data-ds-icon="copy" data-size="15"></span>';
  const ICON_TRASH = '<span data-ds-icon="trash" data-size="15"></span>';

  // A pipeline and its form: the tab names the pipeline, the card is the form.
  function groupHTML(pl) {
    const f = pl.intakeForm && pl.intakeForm.token ? pl.intakeForm : null;
    const colour = pl.color || '#2170f4';

    // color-mix keeps one source of truth for the tint: the pipeline's colour.
    const tint = 'style="--tab-tint: color-mix(in srgb, ' + esc(colour) + ' 12%, #fff);' +
      ' --tab-line: color-mix(in srgb, ' + esc(colour) + ' 26%, var(--dir-line));"';
    const tab = '<div class="fl-tab" ' + tint + '>' +
      pipelineGlyph(colour) +
      '<span class="fl-tab-name">' + esc(pl.name) + '</span></div>';

    if (!f) {
      return '<div class="fl-group">' + tab +
        '<div class="fl-card">' +
          '<span class="fl-icon" style="background:var(--dir-hair); color:var(--dir-faint);">' + ICON_FORM + '</span>' +
          '<div class="fl-main"><div class="fl-name" style="color:var(--dir-muted); font-weight:600;">No form yet</div></div>' +
          '<div class="fl-actions"><button class="fl-btn" onclick="editForm(\'' + esc(pl.id) + '\')">Set up a form</button></div>' +
        '</div></div>';
    }

    const n = submissionsFor(pl, f);
    return '<div class="fl-group">' + tab +
      '<div class="fl-card">' +
        '<span class="fl-icon" style="background:' + esc(colour) + '18; color:' + esc(colour) + ';">' + ICON_FORM + '</span>' +
        '<div class="fl-main">' +
          '<div class="fl-name">' + esc(f.heading || 'Untitled form') + '</div>' +
          '<div class="fl-meta">' +
            // "Active" is gone with the pause control (see PAUSE_UI in form-builder.js):
            // it is now the only state anyone can set, so labelling it said nothing. A
            // form stored as paused still says so — otherwise the one form whose link
            // 404s would be the one row that looked like all the others. Opening it in
            // the editor and saving is what clears it.
            (f.enabled ? '' : '<span class="fl-state off">Paused</span><span class="fl-sep">·</span>') +
            (n ? '<span><b>' + n + '</b> ' + (n === 1 ? 'submission' : 'submissions') + '</span>'
               : '<span>No submissions yet</span>') +
          '</div>' +
        '</div>' +
        '<div class="fl-actions">' +
          '<button class="fl-btn icon" title="Copy link" onclick="copyLink(this, \'' + esc(f.token) + '\')">' + ICON_COPY + '</button>' +
          '<a class="fl-btn icon" title="Open the form" href="' + esc(formUrlFor(f.token)) + '" target="_blank" rel="noopener">' + ICON_OPEN + '</a>' +
          '<button class="fl-btn primary" onclick="editForm(\'' + esc(pl.id) + '\')">Edit</button>' +
          // Last, and set apart, because it is the one action here that can't be undone.
          '<button class="fl-btn icon danger" title="Delete this form" aria-label="Delete this form"' +
            ' onclick="deleteFormFromRow(\'' + esc(pl.id) + '\')">' + ICON_TRASH + '</button>' +
        '</div>' +
      '</div></div>';
  }

  // Editing happens over this page — the list is the context you want back when you
  // are done, and bouncing to a separate document loses it.
  let PIPELINES = {};
  function editForm(pipelineId) {
    const pl = PIPELINES[pipelineId];
    if (!pl) return;
    window.titanFormBuilder.open({
      pipeline: pl,
      form: pl.intakeForm || null,
      personaId: window.PERSONA_ID,
      onSave: async function (form, pipeline) {
        window.DATA.pipelines[pipelineId].intakeForm = form;
        window.DATA.pipelines[pipelineId].customFieldDefs = pipeline.customFieldDefs || [];
        await window.saveData();
        render(window.DATA.pipelines);
      },
      onDelete: function () { return deleteForm(pipelineId); },
    });
  }

  // The delete itself, shared by the row's button and the builder's. Restores the form
  // if the write fails, so a failed delete leaves the row as it was rather than showing
  // a form that is gone from the page but not from the document.
  async function deleteForm(pipelineId) {
    const pl = window.DATA.pipelines[pipelineId];
    if (!pl || !pl.intakeForm) return;
    const previous = pl.intakeForm;
    delete pl.intakeForm;
    try {
      await window.saveData();
    } catch (e) {
      pl.intakeForm = previous;
      render(window.DATA.pipelines);
      throw e;
    }
    render(window.DATA.pipelines);
  }

  // Confirmed with the same wording the builder uses, so deleting from the row and
  // deleting from inside the editor are the same action, not two.
  async function deleteFormFromRow(pipelineId) {
    const pl = PIPELINES[pipelineId];
    if (!pl) return;
    if (!window.titanFormBuilder.confirmDelete(pl.name)) return;
    try { await deleteForm(pipelineId); }
    catch (e) {
      document.getElementById('fl-note').textContent =
        'Couldn’t delete the form: ' + ((e && e.message) || e);
    }
  }

  function copyLink(btn, token) {
    navigator.clipboard.writeText(formUrlFor(token)).then(function () {
      btn.classList.add('is-done');
      btn.title = 'Copied';
      setTimeout(function () { btn.classList.remove('is-done'); btn.title = 'Copy link'; }, 1400);
    }).catch(function () { btn.title = 'Copy failed'; });
  }

  (async function init() {
    let data;
    try { data = await fetchPipelineData(); }
    catch (e) {
      document.getElementById('fl-note').innerHTML =
        'Couldn’t reach the CRM data API. <a href="' + crmPath('/crm') + '">Open Titan CRM</a>';
      return;
    }
    const pipelines = data.pipelines || {};
    const list = Object.keys(pipelines).map(function (id) { return pipelines[id]; });
    window.titanSidebar.setPipelines(list);

    render(pipelines);
  })();

  // Forms first, then the pipelines that could have one — one list, so a pipeline
  // reads the same whether or not it has a form yet. Called again after a save so
  // the row reflects the edit without a reload.
  function render(pipelines) {
    PIPELINES = pipelines;
    const list = Object.keys(pipelines).map(function (id) { return pipelines[id]; });
    const withForm = list.filter(function (pl) { return pl.intakeForm && pl.intakeForm.token; });
    const without = list.filter(function (pl) { return !(pl.intakeForm && pl.intakeForm.token); });
    document.getElementById('fl-live').innerHTML =
      withForm.concat(without).map(groupHTML).join('') ||
      '<div class="fl-empty">No pipelines yet.</div>';
  }
  (function noop() {
  })();
</script>
</body>
</html>
