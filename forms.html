<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Hotjar. One shared file rather than the snippet pasted into every page;
     see analytics.js. Loaded early so a session is recorded from first paint. -->
<script src="/analytics.js"></script>
<title>Forms — Titan CRM</title>
<!-- Persona loader: ?u=<id> scopes the /api/data fetch and loads personas/<id>.js. -->
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('u');
    var u = (raw && /^[a-z0-9_-]{1,32}$/.test(raw)) ? raw.toLowerCase() : null;
    if (u) document.write('<' + 'script src="/personas/' + u + '.js"><' + '/script>');
  })();
</script>
  <!-- Design system tokens. Everything below can use --text-primary, --accent-primary,
       and the bridged --dir-* names; see design-system/DESIGN-SYSTEM.md. -->
<link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
<link rel="stylesheet" href="/titan-sidebar.css">
<link rel="stylesheet" href="/titan-assistant.css">
<link rel="stylesheet" href="/crm-directory.css">
<style>
  /* One row per pipeline, in a table, rather than a tabbed card per pipeline. The
     tabbed layout repeated the pipeline name twice (tab and heading) and spent a whole
     group on rows that mostly said "No submissions yet", so it grew with the number of
     pipelines while telling you very little. The table's Destination column is the
     point: it names the pipeline a submission lands in, and it is the column that
     generalises if a form is ever allowed more than one.

     Header and body shape follow the CRM's shared table rules — the same values
     .dir-table and .seq-library-table use. Keep them in step. */
  .fl-view { padding: var(--space-400); }
  .fl-frame { width: min(100%, calc(var(--space-400) * 36)); margin-inline: auto; }
  .fl-toolbar {
    margin-bottom: var(--space-200); display: flex; align-items: flex-end;
    justify-content: space-between; gap: var(--space-200); flex-wrap: nowrap;
  }
  .fl-search {
    width: calc(var(--input-height) * 8.5); max-width: 100%; min-width: 0;
    flex: 0 1 calc(var(--input-height) * 8.5);
  }
  .fl-table-shell {
    overflow-x: auto; border: var(--btn-border-width) solid var(--border-subtle);
    border-radius: var(--radius-container); background: var(--surface-primary);
  }
  .fl-table { width: 100%; min-width: calc(var(--input-height) * 26); border-collapse: collapse; table-layout: fixed; }
  .fl-table th {
    padding: var(--space-125) var(--space-200); border-bottom: var(--btn-border-width) solid var(--border-default);
    background: var(--surface-recessed); color: var(--text-muted); font-size: var(--text-2xs);
    font-weight: var(--weight-semi); letter-spacing: 0.055em; text-transform: uppercase;
    text-align: left; white-space: nowrap;
  }
  .fl-table td {
    height: calc(var(--space-400) + var(--space-300)); padding: var(--space-150) var(--space-200);
    border-bottom: var(--btn-border-width) solid var(--border-subtle); color: var(--text-primary);
    font-size: var(--text-sm); vertical-align: middle;
  }
  .fl-table tbody tr:last-child td { border-bottom: 0; }
  /* Rows are not clickable here, unlike the directory and sequence tables: this row
     carries a delete control, and a click target wrapping a destructive button is how
     you delete a form you meant to open. The form name is the link instead. */
  .fl-table th:nth-child(1) { width: 34%; }
  .fl-table th:nth-child(2) { width: 24%; }
  .fl-table th:nth-child(3) { width: 15%; }
  .fl-table th:nth-child(4) { width: 27%; }
  /* The identity column carries no avatar the way contacts/companies do, so its name
     would otherwise sit flush against the shared 16px inset. Header and cell move
     together so they stay aligned. */
  .fl-table th:first-child { padding-inline-start: var(--space-300); }
  .fl-table td:first-child { padding-inline-start: var(--space-300); }
  .fl-table th:first-child .fl-sort { margin-inline-start: calc(var(--space-100) * -1); }

  /* The header label is a sort button, so ds-btn's own type would win over the th.
     Restate the shared header typography on the control. */
  .fl-sort {
    margin-block: calc(var(--space-050) * -1);
    margin-inline: calc(var(--space-100) * -1);
    font-size: var(--text-2xs); font-weight: var(--weight-semi);
    letter-spacing: 0.055em; text-transform: uppercase; color: var(--text-muted);
  }
  .fl-sort-indicator { width: var(--space-150); text-align: center; }

  .fl-name { min-width: 0; display: flex; align-items: center; gap: var(--space-100); }
  .fl-name-link {
    overflow: hidden; color: var(--text-accent); font-weight: var(--weight-semi);
    font-size: var(--text-md); line-height: 1.35; text-decoration: none;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .fl-name-link:hover { text-decoration: underline; }
  /* No "Accepting" counterpart on purpose. It is the only state anyone can set, so
     labelling it said nothing — the same reason the old card dropped it. A form stored
     as paused still says so, because its link is the one that 404s. */
  .fl-name-none { color: var(--text-muted); font-weight: var(--weight-semi); font-size: var(--text-md); }
  /* The Destination tag navigates to its pipeline's board. The anchor wraps the
     component rather than restyling it: ds-pipeline-tag stays a tag, and this only
     makes it a link. Hover deepens the tag's own tint through --pipe rather than
     underlining, which reads badly inside a chip. */
  .fl-dest-link {
    display: inline-flex; max-width: 100%; text-decoration: none; border-radius: var(--radius-control);
  }
  .fl-dest-link:hover .ds-pipeline-tag {
    background: color-mix(in srgb, var(--pipe, var(--accent-primary)) 22%, var(--surface-primary));
    border-color: color-mix(in srgb, var(--pipe, var(--accent-primary)) 45%, var(--border-subtle));
  }
  .fl-dest-link:focus-visible { outline: calc(var(--btn-border-width) * 2) solid var(--border-accent); outline-offset: var(--space-025); }
  .fl-number { color: var(--text-primary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fl-blank { color: var(--text-muted); }
  .fl-actions { display: flex; gap: var(--space-100); align-items: center; justify-content: flex-end; }
  /* Momentary confirmation on the copy button; the icon set has no tick-in-circle that
     reads at this size, so the affordance is the colour change. */
  .fl-copied { border-color: var(--status-success) !important; color: var(--status-success) !important; }
  .fl-empty { padding: calc(var(--space-400) * 2); color: var(--text-secondary); text-align: center; }
  @media (max-width: 32rem) {
    .fl-toolbar { align-items: stretch; flex-wrap: wrap; }
    .fl-search { width: 100%; }
  }
</style>
</head>
<body class="subpage-body" data-subpage="forms" data-sidebar-data="page">

<div class="app-window">
  <!-- The sidebar is one component: titan-sidebar.js renders it. -->
  <div id="sidebar-mount"></div>

  <div class="main-area">
    <div class="subpage-top">
      <!-- No back link: this is a top-level destination in its own right, reached from
           the sidebar, which is also how you leave it. A back arrow here implied it was
           somewhere you'd arrived at from the board. -->
      <span class="subpage-title">Forms</span>
    </div>

    <div class="fl-view">
      <div class="fl-frame">
        <div class="fl-toolbar">
          <input class="ds-input fl-search" id="fl-search" type="search" placeholder="Search forms" aria-label="Search forms">
        </div>
        <div class="fl-table-shell">
          <table class="fl-table">
            <thead>
              <tr>
                <th aria-sort="ascending"><button class="ds-btn ds-btn--ghost ds-btn--sm fl-sort" type="button" data-fl-sort="name">Form <span class="fl-sort-indicator" data-sort-indicator aria-hidden="true"></span></button></th>
                <th>Destination</th>
                <th><button class="ds-btn ds-btn--ghost ds-btn--sm fl-sort" type="button" data-fl-sort="submissions">Submissions <span class="fl-sort-indicator" data-sort-indicator aria-hidden="true"></span></button></th>
                <th><span aria-hidden="true"></span></th>
              </tr>
            </thead>
            <tbody id="fl-list"></tbody>
          </table>
          <div class="fl-empty" id="fl-empty">Loading forms…</div>
        </div>
        <div class="dir-note" id="fl-note"></div>
      </div>
    </div>
  </div>
</div>

<script src="/design-system/components/icon.js"></script>
<script src="/design-system/components/pipeline-tag.js"></script>
<script src="/titan-sidebar.js"></script>
<script src="/crm-owner.js"></script>
<script src="/crm-views.js"></script>
<script src="/titan-assistant.js"></script>
<script src="/crm-directory.js"></script>
<script>
  const esc = window.esc;

  const ICON_OPEN = '<span data-ds-icon="open-external" data-size="15"></span>';
  const ICON_COPY = '<span data-ds-icon="copy" data-size="15"></span>';
  const ICON_TRASH = '<span data-ds-icon="trash" data-size="15"></span>';

  function formUrlFor(token) { return location.origin + '/f/' + encodeURIComponent(token); }
  function formEditorUrlFor(pipelineId) {
    const q = new URLSearchParams(location.search);
    q.set('from', 'forms');
    return '/crm/pipeline/' + encodeURIComponent(pipelineId) + '/form?' + q.toString();
  }

  function submissionsFor(pl, form) {
    const label = (form && form.sourceLabel) || 'Form';
    return (pl.cards || []).filter(function (c) {
      return c.createdBy === 'Form' || c.source === label;
    }).length;
  }

  // One row's facts, gathered once so the sort comparator and the markup read the same
  // numbers. `form` is null for a pipeline that could have a form and doesn't.
  function rowFor(pl) {
    const form = pl.intakeForm && pl.intakeForm.token ? pl.intakeForm : null;
    return {
      pipeline: pl,
      form: form,
      name: form ? (form.heading || 'Untitled form') : '',
      submissions: form ? submissionsFor(pl, form) : 0,
    };
  }

  let flSortKey = 'submissions';
  let flSortDirection = 'desc';
  let flSearch = '';

  function rowHTML(item) {
    const pl = item.pipeline;
    const form = item.form;
    // Destination is the pipeline a submission lands in, and it links to that
    // pipeline's board. One tag today, because the form is a field on its pipeline
    // (pipelines[id].intakeForm) and api/_form.js finds that pipeline by scanning for
    // the token. If a form ever carries pipelineIds[], this cell renders N of these and
    // nothing else here has to change.
    const destination =
      '<a class="fl-dest-link" href="' + esc(window.crmPath('/crm/pipeline/' + encodeURIComponent(pl.id))) + '"' +
        ' title="Open ' + esc(pl.name || 'this pipeline') + '">' +
        window.dsPipelineTag({ name: pl.name, color: pl.color, size: 'sm' }) +
      '</a>';

    if (!form) {
      return '<tr>' +
        '<td><div class="fl-name"><span class="fl-name-none">No form yet</span></div></td>' +
        '<td>' + destination + '</td>' +
        '<td class="fl-blank">—</td>' +
        '<td><div class="fl-actions">' +
          '<button class="ds-btn ds-btn--primary" type="button" onclick="editForm(\'' + esc(pl.id) + '\')">Set up a form</button>' +
        '</div></td>' +
      '</tr>';
    }

    return '<tr>' +
      '<td><div class="fl-name">' +
        '<a class="fl-name-link" title="Edit form" href="' + esc(formEditorUrlFor(pl.id)) + '">' + esc(item.name) + '</a>' +
        (form.enabled ? '' : '<span class="ds-badge">Paused</span>') +
      '</div></td>' +
      '<td>' + destination + '</td>' +
      '<td class="fl-number">' + item.submissions + '</td>' +
      '<td><div class="fl-actions">' +
        '<button class="ds-btn ds-btn--secondary ds-btn--icon" type="button" title="Copy link" aria-label="Copy link"' +
          ' onclick="copyLink(this, \'' + esc(form.token) + '\')">' + ICON_COPY + '</button>' +
        '<a class="ds-btn ds-btn--secondary ds-btn--icon" title="Open the form" aria-label="Open the form"' +
          ' href="' + esc(formUrlFor(form.token)) + '" target="_blank" rel="noopener">' + ICON_OPEN + '</a>' +
        '<button class="ds-btn ds-btn--secondary" type="button" onclick="editForm(\'' + esc(pl.id) + '\')">Edit</button>' +
        // Last, and set apart, because it is the one action here that can't be undone.
        '<button class="ds-btn ds-btn--destructive-quiet ds-btn--icon" type="button" title="Delete this form"' +
          ' aria-label="Delete this form" onclick="deleteFormFromRow(\'' + esc(pl.id) + '\')">' + ICON_TRASH + '</button>' +
      '</div></td>' +
    '</tr>';
  }

  // Form creation/editing is a full-page settings task. The editor route owns the
  // workspace and returns here when the user is done; `from` is an enum rather than a
  // return URL so it cannot become an open redirect.
  let PIPELINES = {};
  function editForm(pipelineId) {
    if (!PIPELINES[pipelineId]) return;
    location.href = formEditorUrlFor(pipelineId);
  }

  // The delete itself, shared by the row's button and the builder's. Restores the form
  // if the write fails, so a failed delete leaves the row as it was rather than showing
  // a form that is gone from the page but not from the document.
  async function deleteForm(pipelineId) {
    const pl = window.DATA.pipelines[pipelineId];
    if (!pl || !pl.intakeForm) return;
    const previous = pl.intakeForm;
    delete pl.intakeForm;
    try {
      await window.saveData();
    } catch (e) {
      pl.intakeForm = previous;
      render(window.DATA.pipelines);
      throw e;
    }
    render(window.DATA.pipelines);
  }

  function confirmDeleteForm(pipelineName) {
    return confirm('Delete the form on “' + (pipelineName || 'this pipeline') + '”?\n\n' +
      'Its link stops working immediately and cannot be restored — a new form gets a new link. ' +
      'Records that already came in through it stay where they are.');
  }

  // Confirmed with the same wording as the full-page editor, so deleting from the row
  // and deleting inside the editor are the same action, not two.
  async function deleteFormFromRow(pipelineId) {
    const pl = PIPELINES[pipelineId];
    if (!pl) return;
    if (!confirmDeleteForm(pl.name)) return;
    try { await deleteForm(pipelineId); }
    catch (e) {
      document.getElementById('fl-note').textContent =
        'Couldn’t delete the form: ' + ((e && e.message) || e);
    }
  }

  function copyLink(btn, token) {
    navigator.clipboard.writeText(formUrlFor(token)).then(function () {
      btn.classList.add('fl-copied');
      btn.title = 'Copied';
      setTimeout(function () { btn.classList.remove('fl-copied'); btn.title = 'Copy link'; }, 1400);
    }).catch(function () { btn.title = 'Copy failed'; });
  }

  document.getElementById('fl-search').addEventListener('input', function (event) {
    flSearch = event.target.value;
    render(PIPELINES);
  });

  document.addEventListener('click', function (event) {
    const button = event.target.closest('[data-fl-sort]');
    if (!button) return;
    const key = button.dataset.flSort;
    if (flSortKey === key) flSortDirection = flSortDirection === 'asc' ? 'desc' : 'asc';
    else {
      flSortKey = key;
      flSortDirection = key === 'name' ? 'asc' : 'desc';
    }
    render(PIPELINES);
  });

  (async function init() {
    let data;
    try { data = await fetchPipelineData(); }
    catch (e) {
      document.getElementById('fl-empty').hidden = true;
      document.getElementById('fl-note').innerHTML =
        'Couldn’t reach the CRM data API. <a href="' + crmPath('/crm') + '">Open Titan CRM</a>';
      return;
    }
    const pipelines = data.pipelines || {};
    const list = Object.keys(pipelines).map(function (id) { return pipelines[id]; });
    window.titanSidebar.setPipelines(list);

    render(pipelines);
  })();

  // Forms first, then the pipelines that could have one — one list, so a pipeline reads
  // the same whether or not it has a form yet, and the formless rows stay out of the way
  // of the sort rather than interleaving with real numbers. Called again after a save so
  // the row reflects the edit without a reload.
  function render(pipelines) {
    PIPELINES = pipelines;
    const query = flSearch.trim().toLowerCase();
    const rows = Object.keys(pipelines).map(function (id) { return rowFor(pipelines[id]); })
      .filter(function (item) {
        if (!query) return true;
        return [item.name, item.pipeline.name].join(' ').toLowerCase().includes(query);
      })
      .sort(function (left, right) {
        // A pipeline without a form has no numbers to rank, so it sits below the ones
        // that do regardless of which column is sorted.
        if (!!left.form !== !!right.form) return left.form ? -1 : 1;
        let comparison;
        if (flSortKey === 'name') {
          comparison = String(left.name || left.pipeline.name || '')
            .localeCompare(String(right.name || right.pipeline.name || ''));
        } else {
          comparison = Number(left[flSortKey]) - Number(right[flSortKey]);
        }
        return flSortDirection === 'asc' ? comparison : comparison * -1;
      });

    document.getElementById('fl-list').innerHTML = rows.map(rowHTML).join('');

    const empty = document.getElementById('fl-empty');
    empty.textContent = Object.keys(pipelines).length
      ? 'No forms match this search.'
      : 'No pipelines yet.';
    empty.hidden = rows.length > 0;

    document.querySelectorAll('[data-fl-sort]').forEach(function (button) {
      const active = button.dataset.flSort === flSortKey;
      const heading = button.closest('th');
      heading.setAttribute('aria-sort', active ? (flSortDirection === 'asc' ? 'ascending' : 'descending') : 'none');
      button.querySelector('[data-sort-indicator]').textContent = active ? (flSortDirection === 'asc' ? '↑' : '↓') : '';
    });

    if (window.dsIcon && window.dsIcon.hydrate) window.dsIcon.hydrate();
  }
</script>
</body>
</html>
